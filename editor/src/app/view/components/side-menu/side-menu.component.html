<aside class="flex h-full flex-col gap-5 overflow-auto p-4" aria-label="Model nodes">
  <label class="flex flex-col gap-2"
    >Find a node
    <input suiInput name="search" [ngModel]="search()" (ngModelChange)="search.set($event)" type="search" />
  </label>
  <section class="flex flex-col gap-2" aria-label="Current nodes">
    <h2 class="font-semibold">Nodes</h2>
    @for (node of nodes(); track node.id) {
      <button
        suiButton
        variant="text"
        [attr.aria-current]="workspace.store.currentNodeId() === node.id ? 'page' : null"
        (click)="handleSelect(node)"
      >
        {{ node.name }}
      </button>
    } @empty {
      <p class="text-sm opacity-70">No nodes yet.</p>
    }
  </section>
  @if (workspace.view.editable()) {
    <section class="flex flex-col gap-2" aria-label="Node suggestions">
      <h2 class="font-semibold">Create from</h2>
      @for (base of suggestions(); track base.ref) {
        <button suiButton variant="outlined" size="sm" (click)="handleCreateNode(base)">+ {{ base.name }}</button>
      }
    </section>
  }
</aside>
