<aside class="flex h-full w-56 flex-col">
  <div class="border-base-300 flex flex-col gap-4 border-b p-4">
    <div class="min-w-0">
      <p class="text-base-content/55 text-xs font-medium tracking-wider uppercase">Model level</p>
      <h2 class="truncate font-semibold">{{ workspace.store.currentModel()?.name }}</h2>
    </div>
    <input
      suiInput
      name="search"
      aria-label="Find a node"
      placeholder="Find a node…"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
      type="search"
      size="sm"
    />
  </div>
  <sui-sidebar
    class="block min-h-0 flex-1 overflow-auto"
    size="sm"
    ariaLabel="Model nodes"
    [groups]="groups()"
    [value]="workspace.store.currentNodeId()"
    (valueChange)="handleSelect($event)"
  >
    <ng-template [suiSidebarItem]="groups()" let-item>
      <span class="flex min-w-0 items-start gap-2.5 py-1">
        <svg lucideBox class="mt-0.5 size-4 shrink-0 opacity-60" aria-hidden="true"></svg>
        <span class="flex min-w-0 flex-col gap-0.5">
          <span class="truncate text-sm font-medium">{{ item.label }}</span>
          <span class="truncate text-xs opacity-60">{{ item.base ? 'refines ' + item.base : 'Base definition' }}</span>
        </span>
      </span>
    </ng-template>
  </sui-sidebar>
  <div class="border-base-300 flex flex-col gap-3 border-t p-4">
    @if (!groups()[0]?.items?.length) {
      <p class="text-base-content/60 text-sm">No matching nodes.</p>
    }
    @if (workspace.view.editable()) {
      <button suiButton size="sm" class="w-full" (click)="handleCreate()">
        <svg lucidePlus class="size-4" aria-hidden="true"></svg>Create node
      </button>
    }
  </div>
</aside>
