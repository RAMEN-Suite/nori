<button
  *transloco="let t"
  suiButton
  [severity]="findings().length ? (hasErrors() ? 'error' : 'warning') : 'neutral'"
  variant="text"
  size="sm"
  shape="circle"
  [attr.aria-keyshortcuts]="shortcuts.aria('validation')"
  [attr.aria-label]="t('editor.validationTitle')"
  [noriTooltip]="t('editor.validationTitle') + shortcuts.hint('validation')"
  placement="bottom"
  [showDelay]="600"
  (click)="handleShowDetails()"
>
  @if (findings().length) {
    <svg lucideShieldAlert class="size-4" aria-hidden="true"></svg>
  } @else {
    <svg lucideShieldCheck class="size-4" aria-hidden="true"></svg>
  }
</button>
