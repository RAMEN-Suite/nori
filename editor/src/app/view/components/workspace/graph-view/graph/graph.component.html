<div #host class="host"></div>
@if (nameEditorPosition(); as position) {
  <nori-inline-name-input
    *transloco="let t"
    class="absolute -translate-1/2"
    style="display: block"
    fieldClass="text-center font-semibold"
    [style.left.px]="position.x"
    [style.top.px]="position.y"
    [style.width.px]="position.width"
    [maxLength]="40"
    [label]="t('editor.nodeName')"
    [(value)]="rename.draft"
    [readOnly]="rename.isSaving()"
    (submitted)="handleSaveName(true)"
    (focusLeft)="handleSaveName()"
    (cancelled)="handleCancelRename()"
  />
}
@if (relationActionsPosition(); as position) {
  @if (workspace.store.currentRelationId(); as relationId) {
    <nori-relation-actions
      class="graph-selection-actions absolute -translate-x-1/2 -translate-y-full"
      [relationId]="relationId"
      [style.left.px]="position.x"
      [style.top.px]="position.y"
    />
  }
}
@if (graphTools.tool() !== 'select') {
  <nori-graph-mode-hint class="graph-tool-hint" data-nori-motion />
}
@if (nodeActionsPosition(); as position) {
  @if (workspace.store.currentNodeId(); as nodeId) {
    <nori-node-actions
      class="graph-selection-actions absolute -translate-x-1/2 -translate-y-full"
      [nodeId]="nodeId"
      [style.left.px]="position.x"
      [style.top.px]="position.y"
    />
  }
}
