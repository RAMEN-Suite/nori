<sui-card *transloco="let t" size="xs" variant="border">
  <div class="flex items-center gap-1">
    <button
      suiButton
      severity="error"
      variant="text"
      size="xs"
      shape="circle"
      [noriIconTooltip]="t('editor.removeConnection')"
      placement="bottom"
      [showDelay]="600"
      [disabled]="relationEditing.isPending()"
      (click)="relationEditing.remove(relationId())"
    >
      <svg lucideTrash class="size-3.5" aria-hidden="true"></svg>
    </button>
  </div>
</sui-card>
