@if (workspace.queries.currentNode(); as node) {
  <section *transloco="let t" class="flex flex-col" [attr.aria-label]="node.name">
    <div class="flex min-h-8 items-center gap-2">
      @if (editingName() && workspace.queries.nodeEditable()) {
        <input
          suiInput
          fluid
          noriAutoselect
          name="nodeName"
          size="sm"
          maxlength="40"
          class="h-8 text-xl font-semibold"
          [attr.aria-label]="t('editor.nodeName')"
          [ngModel]="draftName()"
          (ngModelChange)="draftName.set($event)"
          [readOnly]="savingName()"
          (keydown.enter)="handleSaveName(true)"
          (blur)="handleBlurName()"
          (keydown.escape)="$event.stopPropagation(); handleCancelRename()"
        />
      } @else if (showEditingControls() && workspace.queries.nodeEditable()) {
        <h1 class="min-w-0 flex-1 text-xl leading-8 font-semibold break-words" [attr.aria-label]="node.name">
          <button
            #renameTarget
            type="button"
            class="block min-w-0 cursor-text rounded-[var(--nori-radius-input)] text-left break-words"
            [attr.aria-label]="t('editor.renameNode')"
            (click)="handleStartRename()"
          >
            {{ node.name }}
          </button>
        </h1>
      } @else {
        <h1 #renameTarget tabindex="-1" class="min-w-0 flex-1 text-xl leading-8 font-semibold break-words" (dblclick)="handleStartRename()">
          {{ node.name }}
        </h1>
      }
      @if (!editingName()) {
        <ng-content />
      }
    </div>
  </section>
}
