<section *transloco="let t" class="property-node-info min-w-0 px-5 py-5">
  <div class="min-w-0">
    <nori-node-basics
      id="property-workspace-node-title"
      class="[&_h1]:truncate [&_h1>button]:max-w-full [&_h1>button]:truncate"
      [showEditingControls]="true"
    >
      <button
        suiButton
        type="button"
        severity="neutral"
        variant="text"
        size="xs"
        shape="circle"
        class="shrink-0"
        [disabled]="disabled()"
        (click)="openDetails()"
        [attr.aria-label]="t(workspace.queries.isNodeEditable() ? 'editor.editNode' : 'editor.nodeDetails')"
      >
        <svg lucideInfo class="size-3.5" aria-hidden="true"></svg>
      </button>
    </nori-node-basics>
    <div class="text-base-content/55 mt-1 flex h-6 min-w-0 items-center gap-2 text-xs">
      @if (refinement(); as base) {
        <span class="shrink-0">{{ t('editor.refinesLabel') }}</span>
        <button
          type="button"
          class="property-refinement-chip text-base-content inline-flex min-w-0 cursor-pointer items-center gap-1.5 rounded-full border border-[color-mix(in_oklab,var(--refinement-colour)_40%,transparent)] bg-[color-mix(in_oklab,var(--refinement-colour)_10%,transparent)] px-2.5 py-0.5 text-xs"
          [style.--refinement-colour]="colour()"
          [disabled]="disabled()"
          (click)="inspect.emit(base)"
        >
          <span class="size-1.5 shrink-0 rounded-full bg-[var(--refinement-colour)]" aria-hidden="true"></span>
          <span class="truncate">{{ base.node.name }}</span>
        </button>
      } @else {
        <span class="truncate">{{ t('editor.baseNode') }}</span>
      }
    </div>
  </div>
</section>
