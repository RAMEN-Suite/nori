<section *transloco="let t" class="property-node-info flex min-w-0 select-none">
  <button
    type="button"
    class="node-history-item node-history-back relative grid shrink-0 place-items-center rounded-s-[calc(var(--nori-radius)-1px)] enabled:cursor-pointer"
    [class.is-available]="previousName() !== null"
    [disabled]="previousName() === null"
    [attr.aria-hidden]="previousName() === null ? 'true' : null"
    [attr.aria-label]="previousName() === null ? null : t('editor.backToNode', { name: previousName() })"
    (click)="back.emit()"
  >
    <svg lucideChevronLeft class="size-4" aria-hidden="true"></svg>
  </button>
  <div class="min-w-0 flex-1 px-5 py-5">
    <nori-node-basics
      id="property-workspace-node-title"
      class="[&_h1]:truncate [&_h1>button]:max-w-full [&_h1>button]:truncate [&_input]:select-text"
      [showEditingControls]="true"
    >
      <button
        suiButton
        type="button"
        severity="neutral"
        variant="text"
        size="xs"
        shape="circle"
        class="nori-soft-hover shrink-0"
        (click)="openDetails()"
        [attr.aria-label]="t(workspace.queries.isNodeEditable() ? 'editor.editNode' : 'editor.nodeDetails')"
      >
        <svg lucideInfo class="size-3.5" aria-hidden="true"></svg>
      </button>
    </nori-node-basics>
    <div class="text-base-content/55 mt-1 flex h-6 min-w-0 items-center gap-2 text-xs">
      @if (refinement(); as base) {
        <span class="shrink-0">{{ t('editor.refinesLabel') }}</span>
        <button
          type="button"
          class="property-refinement-chip text-base-content inline-flex min-w-0 cursor-pointer items-center gap-1.5 rounded-full border border-[color-mix(in_oklab,var(--refinement-colour)_40%,transparent)] bg-[color-mix(in_oklab,var(--refinement-colour)_10%,transparent)] px-2.5 py-0.5 text-xs"
          [style.--refinement-colour]="colour()"
          (click)="inspect.emit(base)"
        >
          <span class="size-1.5 shrink-0 rounded-full bg-[var(--refinement-colour)]" aria-hidden="true"></span>
          <span class="truncate">{{ base.node.name }}</span>
        </button>
      } @else {
        <span class="truncate">{{ t('editor.baseNode') }}</span>
      }
    </div>
  </div>
  <button
    type="button"
    class="node-history-item node-history-forward relative grid shrink-0 place-items-center rounded-e-[calc(var(--nori-radius)-1px)] enabled:cursor-pointer"
    [class.is-available]="nextName() !== null"
    [disabled]="nextName() === null"
    [attr.aria-hidden]="nextName() === null ? 'true' : null"
    [attr.aria-label]="nextName() === null ? null : t('editor.nodeWorkspace.forwardTo', { name: nextName() })"
    (click)="forward.emit()"
  >
    <svg lucideChevronRight class="size-4" aria-hidden="true"></svg>
  </button>
</section>
