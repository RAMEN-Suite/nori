<section *transloco="let t" class="property-editor">
  <div class="property-cards editor-panel-scroll" [hidden]="!!removing()">
    @for (property of properties(); track property.id) {
      <article class="property-card" [class.is-expanded]="attribute()?.id === property.id && !collapsed()">
        <div class="property-card-heading">
          <button
            type="button"
            class="property-card-trigger"
            [attr.aria-expanded]="attribute()?.id === property.id && !collapsed()"
            [attr.aria-controls]="'property-fields-' + property.id"
            [disabled]="formPending() || discarding()"
            (click)="select(property.id)"
          >
            <svg lucideChevronDown class="property-chevron size-3.5 shrink-0" aria-hidden="true"></svg>
            <span class="min-w-0 flex-1 text-left text-sm font-medium break-words"
              >{{ property.name }}
              @if (property.bounds.lowerBound > 0) {
                <span class="text-error" aria-hidden="true">*</span>
              }
            </span>
            <span suiBadge severity="neutral" variant="soft" size="xs" class="shrink-0">
              {{ workspace.queries.resolveTypeLabel(property.typeId, workspace.store.currentSlot())
              }}{{ property.bounds.upperBound === -1 || property.bounds.upperBound > 1 ? ' [ ]' : '' }}
            </span>
          </button>
          <button
            suiButton
            severity="error"
            variant="text"
            size="xs"
            shape="circle"
            [attr.aria-label]="t('editor.removeNamedProperty', { name: property.name })"
            [noriTooltip]="t('editor.removeProperty')"
            placement="bottom"
            [offset]="12"
            [showDelay]="600"
            [disabled]="formPending() || discarding()"
            (click)="remove(property)"
          >
            <svg lucideTrash class="size-3.5" aria-hidden="true"></svg>
          </button>
        </div>
        <div [id]="'property-fields-' + property.id">
          @if (attribute()?.id === property.id && !collapsed()) {
            <nori-property-form
              class="property-card-fields"
              [style.display]="discarding() ? 'none' : 'flex'"
              [currentAttribute]="property"
              (saved)="editing.select($event)"
              (completed)="reset()"
            />
          }
        </div>
      </article>
    }
    @if (!attribute()) {
      <article class="property-card is-expanded">
        <h3 class="px-4 pt-4 text-sm font-medium">{{ t('editor.addProperty') }}</h3>
        <nori-property-form
          class="property-card-fields"
          [style.display]="discarding() ? 'none' : 'flex'"
          (saved)="editing.select($event)"
          (completed)="cancelNew()"
        />
      </article>
    }
  </div>

  <footer class="property-editor-footer">
    @if (removing(); as property) {
      <section class="flex w-full flex-col gap-4">
        <nori-confirmation-content [message]="{ key: 'editor.confirmRemoveProperty', params: { name: property.name } }" />
        <div class="nori-dialog-actions">
          <button suiButton size="sm" severity="neutral" variant="text" [disabled]="formPending()" (click)="cancelRemoval()">
            <svg lucideX class="size-4 shrink-0" aria-hidden="true"></svg>
            {{ t('common.cancel') }}
          </button>
          <button suiButton size="sm" severity="error" [loading]="formPending()" [disabled]="formPending()" (click)="confirmRemoval()">
            <svg lucideEraser class="size-4 shrink-0" aria-hidden="true"></svg>
            {{ t('editor.removeProperty') }}
          </button>
        </div>
      </section>
    } @else if (discarding()) {
      <div class="flex flex-1 flex-col gap-3" role="alert">
        <p class="text-base-content/75 text-sm leading-relaxed">{{ t('editor.discardPropertyChanges') }}</p>
        <div class="nori-dialog-actions">
          <button suiButton severity="neutral" variant="text" size="sm" (click)="keepEditing()">
            <svg lucidePencil class="size-4 shrink-0" aria-hidden="true"></svg> {{ t('editor.keepEditing') }}
          </button>
          <button suiButton severity="primary" size="sm" (click)="discard()">
            <svg lucideUndo2 class="size-4 shrink-0" aria-hidden="true"></svg> {{ t('editor.discardChanges') }}
          </button>
        </div>
      </div>
    } @else {
      <button suiButton severity="neutral" variant="soft" size="sm" [disabled]="formPending() || !attribute()" (click)="select(null)">
        <svg lucidePlus class="size-3.5" aria-hidden="true"></svg>{{ t('editor.addProperty') }}
      </button>
    }
  </footer>
</section>
