<form *transloco="let t" class="property-form" (ngSubmit)="handleSave()">
  <fieldset class="property-fields" [disabled]="!editable()">
    <legend class="sr-only">{{ t('editor.properties') }}</legend>
    <fieldset class="property-basics">
      <legend class="property-group-title">{{ t('editor.propertyDefinition') }}</legend>
      <label class="property-field"
        >{{ t('editor.propertyName') }}
        <input
          suiInput
          fluid
          size="sm"
          name="name"
          [maxlength]="nameMaxLength"
          (keydown.enter)="$event.preventDefault(); handleSave()"
          [(ngModel)]="name"
          (blur)="handleSave()"
          required
        />
      </label>
      <div class="property-field">
        <span>{{ t('editor.dataType') }}</span>
        <sui-select
          fluid
          size="sm"
          checkmark
          [disabled]="!editable()"
          [ariaLabel]="t('editor.dataType')"
          [options]="typeOptions()"
          [value]="typeId"
          (valueChange)="handleType($event)"
        />
      </div>
    </fieldset>
    <fieldset class="property-option-group">
      <legend class="property-group-title">{{ t('editor.propertyValues') }}</legend>
      <ng-container
        [ngTemplateOutlet]="optionList"
        [ngTemplateOutletContext]="{ $implicit: valueOptions, label: t('editor.propertyValues') }"
      />
    </fieldset>
    @if (multiple) {
      <fieldset class="property-option-group">
        <legend class="property-group-title">{{ t('editor.propertyMultipleValues') }}</legend>
        <ng-container
          [ngTemplateOutlet]="optionList"
          [ngTemplateOutletContext]="{ $implicit: multipleOptions, label: t('editor.propertyMultipleValues') }"
        />
      </fieldset>
    }
    <fieldset class="property-option-group">
      <legend class="property-group-title">{{ t('editor.propertyBehavior') }}</legend>
      <ng-container
        [ngTemplateOutlet]="optionList"
        [ngTemplateOutletContext]="{ $implicit: usageOptions, label: t('editor.propertyBehavior') }"
      />
    </fieldset>
  </fieldset>
  <ng-template #optionList let-options let-label="label">
    <sui-card size="xs" variant="border">
      <sui-list size="xs" [items]="options" [trackBy]="trackOption" [ariaLabel]="label" [dividers]="true" [rowHover]="editable()">
        <ng-template suiListItem let-option>
          <label class="property-option-row col-span-full" [attr.for]="'property-control-' + option">
            <span class="property-option-text">
              <span class="property-option-label">{{ t('editor.propertyOptions.' + option + '.label') }}</span>
              <span class="property-hint" [id]="'property-option-' + option">{{ t('editor.propertyOptions.' + option + '.hint') }}</span>
            </span>
            @switch (option) {
              @case ('minimum') {
                <sui-input-number
                  class="property-count-input"
                  size="sm"
                  [id]="'property-control-' + option"
                  [showButtons]="true"
                  [min]="0"
                  [max]="upperBound === -1 ? undefined : upperBound"
                  [step]="1"
                  [maxFractionDigits]="0"
                  [disabled]="!editable()"
                  [ariaLabel]="t('editor.propertyOptions.minimum.label')"
                  ariaDescribedby="property-option-minimum"
                  [value]="lowerBound"
                  (valueChange)="handleMinimum($event)"
                  (touch)="handleSave()"
                  (keydown.enter)="$event.preventDefault(); handleSave()"
                />
              }
              @case ('maximum') {
                <sui-input-number
                  class="property-count-input"
                  size="sm"
                  [id]="'property-control-' + option"
                  [showButtons]="true"
                  [min]="lowerBound > 2 ? lowerBound : 2"
                  [step]="1"
                  [maxFractionDigits]="0"
                  [disabled]="!editable()"
                  [ariaLabel]="t('editor.propertyOptions.maximum.label')"
                  ariaDescribedby="property-option-maximum"
                  [placeholder]="t('editor.unlimitedValues')"
                  [value]="upperBound === -1 ? null : upperBound"
                  (valueChange)="handleMaximum($event)"
                  (touch)="handleSave()"
                  (keydown.enter)="$event.preventDefault(); handleSave()"
                />
              }
              @default {
                <input
                  suiToggle
                  [id]="'property-control-' + option"
                  severity="neutral"
                  size="sm"
                  type="checkbox"
                  [name]="option"
                  [disabled]="!editable()"
                  [attr.aria-label]="t('editor.propertyOptions.' + option + '.label')"
                  [attr.aria-describedby]="'property-option-' + option"
                  [ngModel]="optionValue(option)"
                  (ngModelChange)="handleOption(option, $event)"
                />
              }
            }
          </label>
        </ng-template>
      </sui-list>
    </sui-card>
  </ng-template>
  @if (error(); as message) {
    <p class="text-error text-sm" role="alert">{{ message }}</p>
  }
</form>
