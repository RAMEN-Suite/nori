<div *transloco="let t" class="relative flex h-full min-h-0 flex-col">
  <div class="absolute inset-0 overflow-hidden">
    <app-graph (nodeSelected)="nodeSelected.emit()" [graphData]="graphData()" [settings]="settings()" />
    @if (!graphData().nodes.length) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 text-center">
        <svg lucideMousePointer2 class="text-base-content/30 size-8" aria-hidden="true"></svg>
        <h2 class="text-lg font-medium">{{ t('editor.emptyTitle') }}</h2>
        <p class="text-base-content/60 max-w-64 text-sm">{{ t('editor.emptyDescription') }}</p>
        @if (workspace.view.editable()) {
          <button suiButton size="sm" (click)="handleCreate()">
            <svg lucidePlus class="size-4" aria-hidden="true"></svg>{{ t('editor.createNode') }}
          </button>
        }
      </div>
    }
  </div>
</div>
