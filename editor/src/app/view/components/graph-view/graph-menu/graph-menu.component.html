<div class="grid h-full grid-rows-[1fr_auto]">
  <div class="min-h-0 overflow-hidden"><app-graph [graphData]="graphData()" [settings]="settings()" /></div>
  <footer class="border-base-300 bg-base-100 flex flex-wrap items-center justify-between gap-3 border-t p-3">
    <div class="flex gap-2">
      @for (layout of layoutOptions; track layout.mode) {
        <button
          suiButton
          size="sm"
          variant="outlined"
          [attr.aria-pressed]="settings().layout === layout.mode"
          (click)="handleSelectLayoutMode(layout.mode)"
        >
          {{ layout.label }}
        </button>
      }
      <button
        suiButton
        size="sm"
        variant="text"
        [attr.aria-pressed]="settings().areIsolatedNodesHidden"
        (click)="handleToggleOption('areIsolatedNodesHidden')"
      >
        Hide isolated nodes
      </button>
    </div>
    <div class="flex gap-2">
      <button suiButton size="sm" variant="outlined" (click)="handleOpenColorsDialog()">Colours</button>
      <button suiButton size="sm" variant="outlined" (click)="handleLayoutReset()">Reset layout</button>
    </div>
  </footer>
</div>
