<button
  *transloco="let t"
  suiButton
  type="button"
  severity="neutral"
  variant="text"
  size="sm"
  shape="circle"
  [attr.aria-label]="t('common.settings')"
  [attr.aria-keyshortcuts]="shortcut() ? shortcuts.aria('settings') : null"
  [appTooltip]="shortcut() ? t('common.settings') + ' (' + shortcut() + ')' : ''"
  placement="bottom"
  [showDelay]="600"
  (click)="handleOpen()"
>
  <svg lucideSettings class="size-5" aria-hidden="true"></svg>
</button>
