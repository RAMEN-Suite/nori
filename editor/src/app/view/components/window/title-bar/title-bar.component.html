<header class="title-bar bg-base-200 flex h-9 items-center justify-between px-3">
  <span>{{ windowState.state().title }} — Nori</span>
  @if (hasControls) {
    <div class="window-buttons flex gap-1">
      <button suiButton size="xs" variant="text" (click)="electron.minimizeApplication()">Minimise</button>
      <button suiButton size="xs" variant="text" (click)="electron.maximizeApplication()">Maximise</button>
      <button suiButton size="xs" variant="text" severity="error" (click)="electron.closeApplication()">Close</button>
    </div>
  }
</header>
