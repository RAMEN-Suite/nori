<section *transloco="let t" class="flex min-h-full flex-col gap-6 px-5 pt-2 pb-5" [attr.aria-label]="t('editor.inspector')">
  <app-node-basics />
  <div suiDivider class="m-0" aria-hidden="true"></div>
  <sui-tabs
    class="inspector-tabs"
    variant="border"
    size="sm"
    [ariaLabel]="t('editor.inspector')"
    [value]="activeTab()"
    (valueChange)="handleTab($event)"
  >
    <ng-template suiTab value="attributes" [label]="t('editor.properties')"><app-node-attributes /></ng-template>
    <ng-template suiTab value="relations" [label]="t('editor.relationships')"><app-node-relations /></ng-template>
  </sui-tabs>
</section>
