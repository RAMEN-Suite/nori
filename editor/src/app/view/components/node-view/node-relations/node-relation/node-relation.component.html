<div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-3">
  <div class="flex min-w-0 flex-wrap items-center gap-2 text-sm">
    @if (!isOutgoing()) {
      <span>{{ resolveNode(relation()?.from?.nodeId ?? '') }}</span>
      <span aria-hidden="true">→</span>
    }
    <span class="font-medium">{{ resolveRelationName(relation()) }}</span>
    @if (isOutgoing()) {
      <span aria-hidden="true">→</span>
      <span>{{ resolveNode(relation()?.to?.nodeId ?? '') }}</span>
    }
  </div>
  @if (workspace.view.editable()) {
    <button suiButton severity="error" size="sm" variant="text" (click)="handleDeleteRelation()">Remove</button>
  }
</div>
