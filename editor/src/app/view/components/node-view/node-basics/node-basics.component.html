@if (workspace.view.currentNode(); as node) {
  <section class="flex flex-col gap-4" aria-label="Node details">
    @if (isWorkingNameActive()) {
      <label class="flex flex-col gap-2"
        >Node name
        <input
          suiInput
          name="nodeName"
          [ngModel]="workingName()"
          (ngModelChange)="workingName.set($event)"
          (keydown.enter)="handleSave()"
        />
      </label>
      <button suiButton (click)="handleSave()">Save name</button>
    } @else {
      <h1 class="text-3xl">{{ node.name }}</h1>
    }
    @if (workspace.view.editable()) {
      <div class="flex flex-wrap gap-2">
        <button suiButton variant="outlined" size="sm" (click)="isWorkingNameActive.set(true)">Rename</button>
        <button suiButton variant="outlined" size="sm" (click)="handleDuplicateNode()">Duplicate</button>
        <button suiButton variant="outlined" size="sm" severity="error" (click)="handleDeleteNode()">Remove</button>
      </div>
    }
    <div class="flex flex-wrap items-center gap-2">
      @for (base of workspace.view.currentNodeChain(); track base.node.id) {
        <sui-chip>Inherits {{ base.node.name }}</sui-chip>
      }
    </div>
  </section>
}
