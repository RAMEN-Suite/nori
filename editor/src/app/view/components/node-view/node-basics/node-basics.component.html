@if (workspace.view.currentNode(); as node) {
  <section *transloco="let t" class="flex flex-col gap-4" [attr.aria-label]="node.name">
    <div class="flex min-h-8 items-start gap-2">
      @if (editingName() && workspace.view.nodeEditable()) {
        <input
          suiInput
          fluid
          appAutoselect
          [focusOnCreate]="true"
          name="nodeName"
          size="sm"
          maxlength="40"
          class="h-8 text-xl font-semibold"
          [attr.aria-label]="t('editor.nodeName')"
          [ngModel]="draftName()"
          (ngModelChange)="draftName.set($event)"
          [readOnly]="savingName()"
          (keydown.enter)="handleSaveName(true)"
          (blur)="handleSaveName()"
          (keydown.escape)="$event.stopPropagation(); handleCancelRename()"
        />
      } @else {
        <h1 class="min-w-0 text-xl leading-8 font-semibold break-words" (dblclick)="handleStartRename()">{{ node.name }}</h1>
        @if (workspace.view.nodeEditable()) {
          <button
            suiButton
            severity="neutral"
            variant="text"
            size="xs"
            shape="circle"
            #renameButton
            class="mt-0.5 shrink-0"
            [attr.aria-label]="t('editor.renameNode')"
            [suiTooltip]="t('editor.renameNode')"
            placement="bottom"
            [showDelay]="600"
            (click)="handleStartRename()"
          >
            <svg lucidePencil class="size-3.5" aria-hidden="true"></svg>
          </button>
        }
      }
    </div>
    @if (base(); as parent) {
      <div class="flex min-w-0 items-center gap-2">
        <button
          suiButton
          severity="neutral"
          variant="text"
          class="h-auto min-w-0 p-0"
          [attr.aria-label]="t('editor.openNodeSource', { name: parent.node.name, model: storage.modelsById().get(parent.modelId)?.name })"
          [suiTooltip]="t('editor.refines', { name: parent.node.name })"
          placement="bottom"
          [showDelay]="600"
          (click)="handleOpenNode(parent.modelId, parent.node.id)"
        >
          <sui-chip size="sm" severity="neutral" variant="soft" class="max-w-full">
            <span class="size-2 shrink-0 rounded-full" [style.background-color]="baseColour()" aria-hidden="true"></span>
            <span class="truncate">{{ parent.node.name }}</span>
          </sui-chip>
        </button>
      </div>
    } @else if (workspace.view.nodeOwner(); as owner) {
      <button
        suiButton
        severity="neutral"
        variant="text"
        class="h-auto self-start p-0"
        [attr.aria-label]="t('editor.openNodeSource', { name: node.name, model: owner.name })"
        (click)="handleOpenNode(owner.gmodel.id, node.id)"
      >
        <sui-chip size="sm" severity="neutral" variant="soft" [label]="owner.name" />
      </button>
    }
  </section>
}
