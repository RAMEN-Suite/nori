<div class="brand-emblem relative flex shrink-0 items-center justify-center">
  <div class="brand-grid pointer-events-none absolute inset-0" data-nori-motion aria-hidden="true"></div>
  <svg class="brand-graph absolute" data-nori-motion viewBox="0 0 640 560" fill="none" aria-hidden="true" focusable="false">
    <defs>
      <mask [id]="maskId" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="560">
        <rect width="640" height="560" fill="white" />
        @for (node of graphNodes; track $index) {
          <g [attr.transform]="'translate(' + node.x + ' ' + node.y + ')'" [style.--float-delay]="node.floatDelay">
            <circle class="brand-graph-node" data-nori-motion [attr.r]="node.radius + 1" fill="black" />
          </g>
        }
      </mask>
    </defs>
    <g class="brand-graph-lines" [attr.mask]="'url(#' + maskId + ')'">
      <path
        d="M320 280L190 150L70 90 M190 150L350 80 M320 280L470 120L590 210 M320 280L465 390L600 440 M320 280L135 390L55 495 M320 280L280 490 M190 150L70 255L135 390 M70 90L5 55 M190 150L173 92 M470 120L350 80 M590 210L592 70 M470 120L529 40 M55 495L109 550 M280 490L365 532 M465 390L422 500"
      />
    </g>
    @for (node of graphNodes; track $index) {
      <g [attr.transform]="'translate(' + node.x + ' ' + node.y + ')'" [style.--float-delay]="node.floatDelay">
        <g class="brand-graph-node" data-nori-motion>
          <circle [attr.r]="node.radius" />
          <g [attr.transform]="'scale(' + (node.radius + 8) / 32 + ')'">
            <path
              class="brand-graph-focus"
              data-nori-motion
              [style.--focus-delay]="$index * 6 + 's'"
              vector-effect="non-scaling-stroke"
              d="M-32 -20V-32H-20 M20 -32H32V-20 M32 20V32H20 M-20 32H-32V20"
            />
          </g>
        </g>
      </g>
    }
    <g class="brand-graph-edit brand-edit-float" data-nori-motion style="--edit-delay: 0s; --float-delay: 0s">
      <path class="brand-edit-edge" data-nori-motion pathLength="1" d="M64.2 103.8L-20.4 219.9" />
      <circle class="brand-edit-node" data-nori-motion cx="-25" cy="231" r="12" />
      <path class="brand-edit-edge brand-edit-extension" data-nori-motion pathLength="1" d="M-33 240L-65 277 M-19 241L6 290" />
      <g class="brand-edit-node brand-edit-extension-nodes" data-nori-motion>
        <circle cx="-72" cy="284" r="10" />
        <circle cx="11" cy="300" r="11" />
      </g>
    </g>
    <g class="brand-graph-edit brand-edit-float" data-nori-motion style="--edit-delay: 24s; --float-delay: -12s">
      <path class="brand-edit-edge" data-nori-motion pathLength="1" d="M490 126L575 150" />
      <circle class="brand-edit-node" data-nori-motion cx="588" cy="154" r="14" />
    </g>
    <g class="brand-graph-edit brand-edit-float" data-nori-motion style="--edit-delay: 48s; --float-delay: -24s">
      <path class="brand-edit-edge" data-nori-motion pathLength="1" d="M117 386L-10 329" />
      <circle class="brand-edit-node" data-nori-motion cx="-22" cy="326" r="12" />
      <path class="brand-edit-edge brand-edit-extension" data-nori-motion pathLength="1" d="M-29 336L-49 366 M-32 320L-62 300" />
      <g class="brand-edit-node brand-edit-extension-nodes" data-nori-motion>
        <circle cx="-55" cy="375" r="10" />
        <circle cx="-70" cy="295" r="9" />
      </g>
    </g>
    <g class="brand-graph-objects">
      <foreignObject x="-70" y="-10" width="75" height="100">
        <sui-card class="brand-preview" size="xs" variant="border">
          <div class="brand-text-preview flex flex-col gap-[5px] px-px py-[3px]">
            <span class="brand-text-title mb-[3px] w-[55%]"></span>
            <span></span><span></span><span class="w-3/5"></span> <span></span><span class="w-4/5"></span> <span></span
            ><span class="w-3/5"></span>
          </div>
        </sui-card>
      </foreignObject>
      <foreignObject x="135" y="20" width="76" height="100">
        <sui-card class="brand-preview" size="xs" variant="border">
          <div class="brand-text-preview flex flex-col gap-[5px] px-px py-[3px]">
            <span class="brand-text-title mb-[3px] w-[55%]"></span>
            <span></span><span class="w-4/5"></span><span></span> <span class="w-3/5"></span><span></span>
            <span class="w-4/5"></span>
          </div>
        </sui-card>
      </foreignObject>
      <foreignObject x="520" y="-25" width="144" height="112">
        <sui-card class="brand-preview" size="xs" variant="border">
          <div class="brand-picture relative overflow-hidden rounded">
            <img class="block h-[86px] w-full object-cover" src="images/home/pine-landscape.jpg" width="128" height="86" alt="" />
            <span class="brand-image-region brand-image-region-tree"></span>
            <span class="brand-image-region brand-image-region-lantern"></span>
          </div>
        </sui-card>
      </foreignObject>
      <foreignObject x="55" y="550" width="108" height="64">
        <sui-card class="brand-preview" size="xs" variant="border">
          <div class="flex items-center gap-2">
            <sui-avatar size="xs" shape="circle"><img src="images/home/portrait-a.jpg" width="32" height="32" alt="" /></sui-avatar>
            <div class="brand-person-lines flex flex-1 flex-col gap-[7px]"><span></span><span class="w-[65%]"></span></div>
          </div>
        </sui-card>
      </foreignObject>
      <foreignObject x="365" y="500" width="114" height="64">
        <sui-card class="brand-preview" size="xs" variant="border">
          <div class="flex items-center gap-2">
            <sui-avatar size="xs" shape="circle"><img src="images/home/portrait-b.jpg" width="32" height="32" alt="" /></sui-avatar>
            <div class="brand-person-lines flex flex-1 flex-col gap-[7px]"><span></span><span class="w-[65%]"></span></div>
          </div>
        </sui-card>
      </foreignObject>
    </g>
  </svg>
</div>
