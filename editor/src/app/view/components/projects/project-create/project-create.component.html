<sui-card *transloco="let t" class="entry-card create-card block w-full" size="lg" variant="border">
  <form #projectForm="ngForm" class="project-content project-form flex flex-col gap-5" (ngSubmit)="handleCreateProject(projectForm)">
    <div class="project-heading flex flex-col gap-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 id="create-title" class="project-title">{{ t('create.title') }}</h1>
        <span [class.invisible]="!alternativeVisible()" [attr.inert]="alternativeVisible() ? null : ''">
          <nori-project-alternative
            current="create"
            [disabled]="!alternativeVisible() || busy() || disabled()"
            (selected)="showAlternative.emit()"
          />
        </span>
      </div>
      <p class="text-base-content/65 leading-relaxed">{{ t('create.description') }}</p>
    </div>
    <div class="flex flex-col gap-5">
      <label class="flex flex-col gap-2">
        <span class="nori-field-label">{{ t('create.name') }}</span>
        <input
          suiInput
          fluid
          [fluid]="true"
          name="name"
          maxlength="70"
          [(ngModel)]="draft.name"
          required
          minlength="3"
          [disabled]="busy() || disabled()"
          [placeholder]="t('create.namePlaceholder')"
          aria-describedby="project-name-hint"
        />
        <span id="project-name-hint" class="text-base-content/55 text-xs">{{ t('create.nameHint') }}</span>
      </label>
      <nori-description-field inputId="create-project-description" [(value)]="draft.description" [disabled]="busy() || disabled()" />
      <label class="flex cursor-pointer items-start gap-3 py-2">
        <input suiCheckbox class="shrink-0" type="checkbox" name="example" [(ngModel)]="useExample" [disabled]="busy() || disabled()" />
        <span class="flex flex-col gap-1">
          <span class="font-medium">{{ t('create.example') }}</span>
          <span class="text-base-content/60 text-sm">{{ t('create.exampleDescription') }}</span>
        </span>
      </label>
    </div>
    @if (error(); as message) {
      <p suiMessage severity="error" role="alert">{{ message }}</p>
    }
    <button
      suiButton
      class="mt-auto"
      size="lg"
      type="submit"
      [loading]="busy()"
      [disabled]="!projectForm.valid || !isNameValid() || !isDescriptionValid() || busy() || disabled()"
    >
      <svg lucidePlus class="size-4" aria-hidden="true"></svg>{{ t(busy() ? 'create.creating' : 'home.create') }}
    </button>
  </form>
</sui-card>
