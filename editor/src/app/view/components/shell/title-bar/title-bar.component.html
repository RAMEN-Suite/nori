<header class="title-bar bg-base-200 grid grid-cols-[minmax(5rem,1fr)_minmax(0,auto)_minmax(5rem,1fr)] items-center gap-2 px-3">
  <div aria-hidden="true"></div>
  <div class="flex min-w-0 items-center justify-center gap-2 text-xs font-medium">
    @if (windowState.state().icon === 'folder-plus') {
      <svg lucideFolderPlus class="size-3.5 shrink-0 opacity-60" aria-hidden="true"></svg>
    } @else if (windowState.state().icon === 'folder-open') {
      <svg lucideFolderOpen class="size-3.5 shrink-0 opacity-60" aria-hidden="true"></svg>
    } @else if (windowState.state().icon === 'pencil') {
      <svg lucidePencil class="size-3.5 shrink-0 opacity-60" aria-hidden="true"></svg>
    } @else {
      <svg lucideNetwork class="size-3.5 shrink-0 opacity-60" aria-hidden="true"></svg>
    }
    <span class="truncate">{{ windowState.fullTitle() }}</span>
  </div>
  <div class="flex min-w-0 items-center justify-end gap-3">
    <span class="text-base-content/50 shrink-0 text-(length:--sui-font-size-xs) tabular-nums">[v. {{ version }}]</span>
    @if (hasControls) {
      <div class="window-buttons flex justify-end gap-1">
        <button suiButton size="xs" variant="text" (click)="electron?.minimise()">{{ 'common.minimise' | transloco }}</button>
        <button suiButton size="xs" variant="text" (click)="electron?.maximise()">{{ 'common.maximise' | transloco }}</button>
        <button suiButton size="xs" variant="text" severity="error" (click)="electron?.close()">
          {{ 'common.close' | transloco }}
        </button>
      </div>
    }
  </div>
</header>
