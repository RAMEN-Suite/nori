<div class="flex max-h-96 min-w-80 flex-col gap-4 overflow-auto">
  @for (option of nodeColorOptions(); track option.id) {
    <label class="flex items-center justify-between gap-4" [for]="option.id"
      >{{ option.name }}
      <sui-color-picker [id]="option.id" [value]="colours()[option.id] ?? '#64748b'" (valueChange)="handleColorChange(option.id, $event)" />
    </label>
  }
  <footer class="flex justify-end gap-3">
    <button suiButton variant="outlined" (click)="handleGenerateColors()">Generate colours</button>
    <button suiButton (click)="handleSaveChanges()">Save colours</button>
  </footer>
</div>
