<form class="flex min-w-80 flex-col gap-5" (ngSubmit)="handleSave()">
  <label class="flex flex-col gap-2"
    >Property name
    <input suiInput name="name" [(ngModel)]="name" required />
  </label>
  <div class="flex flex-col gap-2">
    <span>Data type </span
    ><sui-select ariaLabel="Data type" [options]="typeOptions()" [value]="typeId" (valueChange)="handleType($event)" />
  </div>
  <div class="grid grid-cols-2 gap-4">
    <label class="flex flex-col gap-2"
      >Minimum count
      <input suiInput type="number" name="minimum" min="0" [(ngModel)]="lowerBound" required />
    </label>
    <label class="flex flex-col gap-2"
      >Maximum count (−1: unlimited)
      <input suiInput type="number" name="maximum" min="-1" [(ngModel)]="upperBound" required />
    </label>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <label><input suiCheckbox type="checkbox" name="key" [(ngModel)]="isKey" /> Key</label>
    <label><input suiCheckbox type="checkbox" name="readonly" [(ngModel)]="isReadOnly" /> Read only</label>
    <label><input suiCheckbox type="checkbox" name="unique" [(ngModel)]="isUnique" /> Unique list values</label>
    <label><input suiCheckbox type="checkbox" name="ordered" [(ngModel)]="isOrdered" /> Ordered list</label>
  </div>
  <footer class="flex justify-end gap-3">
    <button suiButton type="button" variant="outlined" (click)="dialogRef.close()" [disabled]="dialogRef.pending()">Cancel</button>
    <button suiButton type="submit" [disabled]="!name.trim() || !typeId || dialogRef.pending()">Save property</button>
  </footer>
</form>
