<form *transloco="let t" class="flex min-w-0 flex-col gap-5" (ngSubmit)="handleSave()">
  <label class="flex flex-col gap-2"
    >{{ t('editor.propertyName') }}
    <input suiInput fluid name="name" [(ngModel)]="name" required />
  </label>
  <div class="flex flex-col gap-2">
    <span>{{ t('editor.dataType') }} </span
    ><sui-select [ariaLabel]="t('editor.dataType')" [options]="typeOptions()" [value]="typeId" (valueChange)="handleType($event)" />
  </div>
  <div class="grid grid-cols-2 gap-4">
    <label class="flex flex-col gap-2"
      >{{ t('editor.minimumCount') }}
      <input suiInput fluid type="number" name="minimum" min="0" [(ngModel)]="lowerBound" required />
    </label>
    <label class="flex flex-col gap-2"
      >{{ t('editor.maximumCount') }}
      <input suiInput fluid type="number" name="maximum" min="-1" [(ngModel)]="upperBound" required />
    </label>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <label><input suiCheckbox type="checkbox" name="key" [(ngModel)]="isKey" /> {{ t('editor.keyProperty') }}</label>
    <label><input suiCheckbox type="checkbox" name="readonly" [(ngModel)]="isReadOnly" /> {{ t('editor.readOnlyProperty') }}</label>
    <label><input suiCheckbox type="checkbox" name="unique" [(ngModel)]="isUnique" /> {{ t('editor.uniqueValues') }}</label>
    <label><input suiCheckbox type="checkbox" name="ordered" [(ngModel)]="isOrdered" /> {{ t('editor.orderedValues') }}</label>
  </div>
  <footer class="nori-dialog-actions">
    <button suiButton type="button" severity="neutral" variant="text" (click)="handleCancel()" [disabled]="dialogs.pending()">
      {{ t('common.cancel') }}
    </button>
    <button suiButton type="submit" [loading]="dialogs.pending()" [disabled]="!name.trim() || !typeId || dialogs.pending()">
      {{ t('common.save') }}
    </button>
  </footer>
</form>
