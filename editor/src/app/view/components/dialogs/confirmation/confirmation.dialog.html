<section class="nori-dialog-content">
  <div class="nori-dialog-scroll">
    <app-confirmation-content
      [message]="options().message"
      [details]="options().details ?? []"
      [affectedNodes]="options().affectedNodes ?? []"
      [affectedRelations]="options().affectedRelations ?? []"
      [affectedLevels]="options().affectedLevels ?? []"
    />
  </div>
  <footer class="nori-dialog-actions">
    @for (group of options().buttons; track $index) {
      @for (button of group; track button.label) {
        <button
          suiButton
          [severity]="button.severity ?? 'neutral'"
          [variant]="button.variant ?? (button.severity === 'error' ? null : 'text')"
          [disabled]="dialogs.pending()"
          [loading]="dialogs.pending() && button.severity === 'error'"
          (click)="handleAction(button)"
        >
          @if (!button.click) {
            <svg lucideX class="size-4 shrink-0" aria-hidden="true"></svg>
          } @else if (button.severity === 'error') {
            <svg lucideTrash class="size-4 shrink-0" aria-hidden="true"></svg>
          } @else {
            <svg lucideCheck class="size-4 shrink-0" aria-hidden="true"></svg>
          }
          {{ button.label }}
        </button>
      }
    }
  </footer>
</section>
