<section class="flex max-w-lg flex-col gap-5">
  <h2 class="text-xl font-semibold">{{ options()?.title }}</h2>
  <p [innerHTML]="options()?.message"></p>
  <footer class="flex justify-end gap-3">
    @for (group of options()?.buttons; track $index) {
      @for (button of group; track button.label) {
        <button
          suiButton
          [severity]="button.severity ?? 'primary'"
          [variant]="button.variant ?? 'outlined'"
          [disabled]="dialogs.pending()"
          (click)="handleAction(button)"
        >
          {{ button.label }}
        </button>
      }
    }
  </footer>
</section>
