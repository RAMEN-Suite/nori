<section class="flex min-w-0 flex-col gap-5">
  <p class="text-base-content/75 text-sm leading-relaxed break-words">{{ options().message }}</p>
  @if (options().details?.length) {
    <ul class="text-base-content/65 list-disc space-y-1 pl-5 text-sm">
      @for (detail of options().details; track $index) {
        <li>{{ detail }}</li>
      }
    </ul>
  }
  <footer class="nori-dialog-actions">
    @for (group of options().buttons; track $index) {
      @for (button of group; track button.label) {
        <button
          suiButton
          [severity]="button.severity ?? 'neutral'"
          [variant]="button.variant ?? (button.severity === 'error' ? null : 'text')"
          [disabled]="dialogs.pending()"
          [loading]="dialogs.pending() && button.severity === 'error'"
          (click)="handleAction(button)"
        >
          {{ button.label }}
        </button>
      }
    }
  </footer>
</section>
