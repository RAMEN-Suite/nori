<form *transloco="let t" class="nori-dialog-content" (ngSubmit)="save()">
  <div class="nori-dialog-scroll min-w-0">
    @if (editable()) {
      <div class="flex min-w-0 flex-col gap-5">
        <label class="flex flex-col gap-2">
          <span class="nori-field-label">{{ t('editor.nodeName') }}</span>
          <input
            suiInput
            fluid
            name="nodeName"
            #nameField="ngModel"
            required
            maxlength="40"
            [ngModel]="draftName()"
            (ngModelChange)="draftName.set($event)"
            [disabled]="dialogs.isPending()"
            [invalid]="nameField.touched && (!draftName().trim() || hasDuplicateName())"
            [attr.aria-describedby]="nameField.touched && (!draftName().trim() || hasDuplicateName()) ? 'edit-node-name-error' : null"
          />
          @if (nameField.touched && (!draftName().trim() || hasDuplicateName())) {
            <span id="edit-node-name-error" class="text-error text-xs" role="alert">
              {{ t(hasDuplicateName() ? 'editor.nodeNameTaken' : 'editor.nodeNameRequired', { name: draftName() }) }}
            </span>
          }
        </label>
        <nori-description-field inputId="edit-node-description" [(value)]="draftDescription" [disabled]="dialogs.isPending()" />
      </div>
    } @else {
      <h2 class="text-lg font-medium break-words">{{ node().name }}</h2>
      @if (node().description) {
        <p class="text-base-content/70 mt-3 text-sm leading-relaxed break-words whitespace-pre-wrap">{{ node().description }}</p>
      }
    }
  </div>
  <footer class="nori-dialog-actions shrink-0">
    <button suiButton type="button" severity="neutral" variant="text" size="sm" [disabled]="dialogs.isPending()" (click)="dialogs.close()">
      <svg lucideX class="size-4 shrink-0" aria-hidden="true"></svg>{{ t(editable() ? 'common.cancel' : 'common.close') }}
    </button>
    @if (editable()) {
      <button suiButton type="submit" size="sm" [loading]="dialogs.isPending()" [disabled]="!canSave()">
        <svg lucideSave class="size-4 shrink-0" aria-hidden="true"></svg>{{ t('common.save') }}
      </button>
    }
  </footer>
</form>
