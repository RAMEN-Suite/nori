<div *transloco="let t" class="nori-dialog-content">
  <nori-notifications context="dialog" />
  <div class="nori-scroll-frame -ms-1 -me-5">
    <div noriScrollOverflow #scroll="scrollOverflow" class="editor-panel-scroll min-w-0 overflow-y-auto py-1 pe-3">
      <nori-property-form
        [currentAttribute]="attribute()"
        [hideDefinition]="!!attribute()"
        [editable]="editable()"
        [autoSave]="autoSave()"
        [statusErrors]="true"
        [modelLevelIndex]="levelIndex()"
        (saved)="created($event)"
        (submitRequested)="save()"
      />
    </div>
    <nori-scroll-hints [up]="scroll.canScrollUp()" [down]="scroll.canScrollDown()" />
  </div>
  @if (editable() && !autoSave()) {
    <footer class="nori-dialog-actions -me-2">
      <button suiButton size="sm" severity="neutral" variant="text" [disabled]="dialogs.pending()" (click)="dialogs.close()">
        {{ t('common.cancel') }}
      </button>
      <button suiButton size="sm" [loading]="dialogs.pending()" [disabled]="dialogs.pending() || !form()?.hasChanges()" (click)="save()">
        {{ t(attribute() ? 'editor.saveProperty' : 'editor.addProperty') }}
      </button>
    </footer>
  }
</div>
