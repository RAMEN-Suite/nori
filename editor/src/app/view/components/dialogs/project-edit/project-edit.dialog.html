<form *transloco="let t" #form="ngForm" class="nori-dialog-content" (ngSubmit)="handleSave(form)">
  <div class="nori-dialog-scroll min-w-0">
    <div class="flex min-w-0 flex-col gap-5">
      <label class="flex flex-col gap-2">
        <span class="nori-field-label">{{ t('create.name') }}</span>
        <input
          suiInput
          fluid
          name="name"
          #nameField="ngModel"
          required
          minlength="3"
          maxlength="70"
          [(ngModel)]="name"
          [invalid]="nameField.touched && name().trim().length < 3"
          [disabled]="dialogs.isPending()"
          aria-describedby="edit-project-name-hint"
        />
        <span id="edit-project-name-hint" class="text-xs">
          @if (nameField.touched && name().trim().length < 3) {
            <span class="text-error">{{ t('editor.projectNameTooShort') }}</span>
          } @else {
            <span class="text-base-content/50">{{ t('editor.projectNameLength') }}</span>
          }
        </span>
      </label>
      <nori-description-field inputId="edit-project-description" [(value)]="description" [disabled]="dialogs.isPending()" />
    </div>
  </div>
  <footer class="nori-dialog-actions shrink-0">
    <button suiButton type="button" severity="neutral" variant="text" size="sm" [disabled]="dialogs.isPending()" (click)="dialogs.close()">
      <svg lucideX class="size-4 shrink-0" aria-hidden="true"></svg>
      {{ t('common.cancel') }}
    </button>
    <button
      suiButton
      type="submit"
      size="sm"
      [loading]="dialogs.isPending()"
      [disabled]="!form.valid || name().trim().length < 3 || !isDescriptionValid() || !hasChanges() || dialogs.isPending()"
    >
      <svg lucideSave class="size-4 shrink-0" aria-hidden="true"></svg>
      {{ t('editor.saveProject') }}
    </button>
  </footer>
</form>
