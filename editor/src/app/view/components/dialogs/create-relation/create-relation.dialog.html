<div *transloco="let t" class="flex min-w-80 flex-col gap-5">
  <button suiButton variant="outlined" (click)="handleDirection()">
    {{ direction() === 'OUT' ? 'Outgoing relationship' : 'Incoming relationship' }}
  </button>
  <div class="flex flex-col gap-2">
    <span>Connected node </span
    ><sui-select ariaLabel="Connected node" [options]="targets()" [value]="target()" (valueChange)="handleTarget($event)" />
  </div>
  <div class="flex flex-col gap-2">
    <span>Permitted relationship </span
    ><sui-select
      ariaLabel="Permitted relationship"
      [options]="relationOptions()"
      [value]="relation()"
      (valueChange)="handleRelation($event)"
    />
  </div>
  @if (!targets().length) {
    <p>No permitted connections in this direction.</p>
  }
  <footer class="nori-dialog-actions">
    <button suiButton severity="neutral" variant="text" (click)="dialogs.close()" [disabled]="dialogs.pending()">
      {{ t('common.cancel') }}
    </button>
    <button suiButton (click)="handleSave()" [loading]="dialogs.pending()" [disabled]="!relation() || dialogs.pending()">
      {{ t('editor.addRelationship') }}
    </button>
  </footer>
</div>
