<div *transloco="let t" class="nori-dialog-content">
  <div class="nori-dialog-scroll flex min-w-0 flex-col gap-4">
    <p class="text-sm font-medium">{{ workspace.store.currentModel()?.name }}</p>
    <div class="flex min-w-0 flex-col gap-3">
      <sui-list size="xs" [items]="workspace.queries.validation()?.diagnostics ?? []" [dividers]="false" [rowHover]="false">
        <ng-template suiListItem let-diagnostic>
          <div suiMessage class="col-span-full" [severity]="diagnostic.severity === 'error' ? 'error' : 'warning'" variant="soft">
            <p class="text-sm leading-relaxed">{{ diagnostic.message }}</p>
          </div>
        </ng-template>
      </sui-list>
      @if (!workspace.queries.validation()?.diagnostics?.length) {
        <p suiMessage severity="success" variant="soft">{{ t('editor.valid') }}</p>
      }
    </div>
  </div>
  <footer class="nori-dialog-actions">
    <button suiButton size="sm" severity="neutral" variant="text" (click)="dialogs.close()">
      <svg lucideX class="size-4 shrink-0" aria-hidden="true"></svg> {{ t('common.close') }}
    </button>
  </footer>
</div>
