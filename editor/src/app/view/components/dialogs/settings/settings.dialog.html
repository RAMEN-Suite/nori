<div class="flex min-w-64 flex-col gap-6">
  <div class="flex flex-col gap-3">
    <h3 class="text-sm font-medium">Appearance</h3>
    <sui-select-button ariaLabel="Theme" [options]="themes" [value]="appState.state().theme" (valueChange)="handleTheme($event)" />
  </div>
  <footer class="flex justify-end">
    <button suiButton severity="neutral" variant="soft" (click)="dialogs.close()">Done</button>
  </footer>
</div>
