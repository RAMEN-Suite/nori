<div class="flex min-w-0 flex-col gap-6">
  <fieldset class="flex min-w-0 flex-col gap-3">
    <legend class="mb-3 flex items-center gap-2 text-sm font-medium">
      <svg lucidePalette class="size-4 opacity-60" aria-hidden="true"></svg>Theme
    </legend>
    <sui-card size="xs" variant="border">
      <sui-list size="xs" [items]="themes" ariaLabel="Theme" [dividers]="true" [rowHover]="true">
        <ng-template suiListItem let-theme>
          <label class="settings-row">
            <span
              class="settings-swatch shrink-0"
              aria-hidden="true"
              [attr.data-theme]="theme.id === 'system' ? appState.theme().sushiTheme : theme.sushiTheme"
            >
              <span class="settings-swatch-sidebar"></span>
              <span class="settings-swatch-content"><span></span><span></span><span></span></span>
            </span>
            <span class="flex min-w-0 flex-1 flex-col gap-0">
              <span class="text-sm leading-snug font-medium">{{ theme.name }}</span>
              <span class="text-xs leading-snug text-(--color-base-content)/65">{{ theme.description }}</span>
            </span>
            <span class="settings-control">
              <input
                suiRadio
                type="radio"
                name="theme"
                severity="neutral"
                [value]="theme.id"
                [attr.aria-label]="theme.name"
                [checked]="appState.state().theme === theme.id"
                (change)="appState.setTheme(theme.id)"
              />
            </span>
          </label>
        </ng-template>
      </sui-list>
    </sui-card>
  </fieldset>

  <section class="flex flex-col gap-3" aria-labelledby="settings-behaviour">
    <h3 id="settings-behaviour" class="flex items-center gap-2 text-sm font-medium">
      <svg lucideSlidersHorizontal class="size-4 opacity-60" aria-hidden="true"></svg>Behaviour
    </h3>
    <sui-card size="xs" variant="border">
      <sui-list size="xs" [items]="animationSettings" ariaLabel="Behaviour settings" [dividers]="true" [rowHover]="true">
        <ng-template suiListItem>
          <label class="settings-row">
            <span class="settings-visual" aria-hidden="true">
              <svg lucidePlay class="size-5 opacity-60"></svg>
            </span>
            <span class="flex min-w-0 flex-1 flex-col gap-0">
              <span class="text-sm leading-snug font-medium">Animations</span>
              <span class="text-xs leading-snug text-(--color-base-content)/65">Animate Nori’s interface.</span>
            </span>
            <span class="settings-control">
              <input
                suiToggle
                type="checkbox"
                severity="neutral"
                aria-label="Animations"
                [checked]="appState.state().animations"
                (change)="appState.setAnimations($event.target.checked)"
              />
            </span>
          </label>
        </ng-template>
      </sui-list>
    </sui-card>
  </section>
</div>
