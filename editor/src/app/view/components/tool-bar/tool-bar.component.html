<header class="border-base-300 bg-base-100 flex flex-wrap items-center justify-between gap-3 border-b p-3">
  <a class="font-semibold" routerLink="/">Nori</a>
  <app-breadcrumbs />
  <div class="flex gap-2">
    <button
      suiButton
      size="sm"
      variant="outlined"
      [disabled]="!workspace.view.editable() || !workspace.view.validation()?.valid"
      (click)="handleExportModel()"
    >
      Export model
    </button>
    <button suiButton size="sm" variant="text" (click)="handleToggleTheme()">Change theme</button>
  </div>
</header>
