<nav *transloco="let t" class="editor-chrome" [attr.aria-label]="t('editor.toolbar')">
  @let catalogueShortcut = workspace.view.editable() ? 'R' : 'B';
  @let catalogueLabel = t(workspace.view.editable() ? 'editor.refinements' : 'editor.baseNodes');
  <a
    suiButton
    class="editor-back"
    aria-keyshortcuts="Alt+ArrowLeft"
    data-nori-motion
    routerLink="/"
    severity="neutral"
    variant="text"
    size="sm"
    shape="circle"
    [attr.aria-label]="t('common.back')"
    ><svg lucideArrowLeft class="size-5" aria-hidden="true"></svg
  ></a>
  <sui-card class="editor-tools" data-nori-motion size="xs" variant="border">
    <div class="editor-tools-content flex items-center gap-1 px-3" data-nori-motion>
      <span class="max-w-24 truncate px-2 text-sm font-medium select-none sm:max-w-48">{{ storage.selectedManifest()?.name }}</span>
      <div
        suiDivider
        orientation="vertical"
        class="mx-1 my-0"
        style="height: 1.5rem; align-self: center; --sui-divider-margin: 0"
        aria-hidden="true"
      ></div>
      <button
        suiButton
        severity="neutral"
        [variant]="catalogueOpen() ? 'soft' : 'text'"
        size="sm"
        shape="circle"
        [attr.aria-keyshortcuts]="catalogueShortcut"
        [attr.aria-label]="catalogueLabel"
        [attr.aria-pressed]="catalogueOpen()"
        [suiTooltip]="catalogueLabel + ' (' + catalogueShortcut + ')'"
        placement="bottom"
        [showDelay]="600"
        (click)="toggleCatalogue.emit()"
      >
        @if (workspace.view.editable()) {
          <svg lucideGitBranch class="size-4" aria-hidden="true"></svg>
        } @else {
          <svg lucideBoxes class="size-4" aria-hidden="true"></svg>
        }
      </button>
      @if (workspace.view.editable()) {
        <button
          suiButton
          severity="neutral"
          [variant]="baseNodesOpen() ? 'soft' : 'text'"
          size="sm"
          shape="circle"
          aria-keyshortcuts="B"
          [attr.aria-label]="t('editor.baseNodes')"
          [attr.aria-pressed]="baseNodesOpen()"
          [suiTooltip]="t('editor.baseNodes') + ' (B)'"
          placement="bottom"
          [showDelay]="600"
          (click)="toggleBaseNodes.emit()"
        >
          <svg lucideBoxes class="size-4" aria-hidden="true"></svg>
        </button>
      }
      <button
        suiButton
        severity="neutral"
        [variant]="levelsOpen() ? 'soft' : 'text'"
        size="sm"
        shape="circle"
        aria-keyshortcuts="M"
        [attr.aria-label]="t('editor.levels')"
        [attr.aria-pressed]="levelsOpen()"
        [suiTooltip]="t('editor.levels') + ' (M)'"
        placement="bottom"
        [showDelay]="600"
        (click)="toggleLevels.emit()"
      >
        <svg lucideLayers class="size-4" aria-hidden="true"></svg>
      </button>
      <div
        suiDivider
        orientation="vertical"
        class="mx-1 my-0"
        style="height: 1.5rem; align-self: center; --sui-divider-margin: 0"
        aria-hidden="true"
      ></div>
      <button
        suiButton
        severity="neutral"
        [variant]="graphTools.tool() === 'connect' ? 'soft' : 'text'"
        size="sm"
        shape="circle"
        aria-keyshortcuts="L"
        [attr.aria-pressed]="graphTools.tool() === 'connect'"
        [attr.aria-label]="t('editor.drawConnection')"
        [suiTooltip]="t('editor.drawConnection') + ' (L)'"
        placement="bottom"
        [showDelay]="600"
        [disabled]="!workspace.view.editable() || graphTools.pending()"
        (click)="graphTools.toggle('connect')"
      >
        <svg lucideLink2 class="size-4" aria-hidden="true"></svg>
      </button>
      <button
        suiButton
        severity="neutral"
        [variant]="graphTools.tool() === 'disconnect' ? 'soft' : 'text'"
        size="sm"
        shape="circle"
        aria-keyshortcuts="D"
        [attr.aria-pressed]="graphTools.tool() === 'disconnect'"
        [attr.aria-label]="t('editor.removeConnection')"
        [suiTooltip]="t('editor.removeConnection') + ' (D)'"
        placement="bottom"
        [showDelay]="600"
        [disabled]="!workspace.view.editable() || graphTools.pending()"
        (click)="graphTools.toggle('disconnect')"
      >
        <svg lucideUnlink class="size-4" aria-hidden="true"></svg>
      </button>
      <div
        suiDivider
        orientation="vertical"
        class="mx-1 my-0"
        style="height: 1.5rem; align-self: center; --sui-divider-margin: 0"
        aria-hidden="true"
      ></div>
      <button
        suiButton
        severity="neutral"
        variant="text"
        size="sm"
        shape="circle"
        aria-keyshortcuts="Shift+R"
        [attr.aria-label]="t('editor.reset')"
        [suiTooltip]="t('editor.reset') + ' (Shift+R)'"
        placement="bottom"
        [showDelay]="600"
        (click)="resetGraph.emit()"
      >
        <svg lucideNetwork class="size-4" aria-hidden="true"></svg>
      </button>
      <button
        suiButton
        severity="neutral"
        variant="text"
        size="sm"
        shape="circle"
        aria-keyshortcuts="F"
        [attr.aria-label]="t('editor.fit')"
        [suiTooltip]="t('editor.fit') + ' (F)'"
        placement="bottom"
        [showDelay]="600"
        (click)="fitGraph.emit()"
      >
        <svg lucideMaximize class="size-4" aria-hidden="true"></svg>
      </button>
      <button
        suiButton
        severity="neutral"
        variant="text"
        size="sm"
        shape="circle"
        aria-keyshortcuts="C"
        [attr.aria-label]="t('editor.colours')"
        [suiTooltip]="t('editor.colours') + ' (C)'"
        placement="bottom"
        [showDelay]="600"
        (click)="configureColours.emit()"
      >
        <svg lucidePalette class="size-4" aria-hidden="true"></svg>
      </button>
      <div
        suiDivider
        orientation="vertical"
        class="mx-1 my-0"
        style="height: 1.5rem; align-self: center; --sui-divider-margin: 0"
        aria-hidden="true"
      ></div>
      <button
        suiButton
        severity="neutral"
        variant="text"
        size="sm"
        shape="circle"
        aria-keyshortcuts="P"
        [attr.aria-label]="t('editor.editProject')"
        [suiTooltip]="t('editor.editProject') + ' (P)'"
        placement="bottom"
        [showDelay]="600"
        [disabled]="!storage.selectedManifest()"
        (click)="handleEditProject()"
      >
        <svg lucidePencil class="size-4" aria-hidden="true"></svg>
      </button>
      <app-model-validation />
      <button
        suiButton
        severity="neutral"
        variant="text"
        size="sm"
        shape="circle"
        aria-keyshortcuts="E"
        [attr.aria-label]="t('editor.export')"
        [suiTooltip]="t('editor.export') + ' (E)'"
        placement="bottom"
        [showDelay]="600"
        [disabled]="!canExport()"
        (click)="handleExportModel()"
      >
        <svg lucideDownload class="size-4" aria-hidden="true"></svg>
      </button>
    </div>
  </sui-card>
  <app-settings-button shortcut="," class="editor-settings" data-nori-motion />
</nav>
