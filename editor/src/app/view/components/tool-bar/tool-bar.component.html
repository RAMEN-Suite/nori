<sui-navbar class="border-base-300 bg-base-100 border-b" surface="plain" size="sm" [collapsible]="false" ariaLabel="Project toolbar">
  <a suiNavbarBrand routerLink="/" class="flex items-center gap-2 font-semibold"
    ><svg lucideLayers class="text-primary size-5" aria-hidden="true"></svg>Nori</a
  >
  <div suiNavbarContent class="flex min-w-0 flex-1 items-center gap-4 overflow-x-auto">
    <span class="text-base-content/60 hidden max-w-40 truncate text-sm 2xl:block">{{ storage.selectedManifest()?.name }}</span>
    <app-breadcrumbs />
  </div>
  <button
    suiNavbarAction
    suiButton
    severity="neutral"
    variant="text"
    size="sm"
    shape="square"
    aria-label="Export model"
    suiTooltip="Export model"
    [disabled]="!workspace.view.editable() || !workspace.view.validation()?.valid"
    (click)="handleExportModel()"
  >
    <svg lucideDownload class="size-4" aria-hidden="true"></svg>
  </button>
  <button
    suiNavbarAction
    suiButton
    severity="neutral"
    variant="text"
    size="sm"
    shape="square"
    aria-label="Change theme"
    suiTooltip="Change theme"
    (click)="handleToggleTheme()"
  >
    <svg lucideSunMoon class="size-4" aria-hidden="true"></svg>
  </button>
</sui-navbar>
