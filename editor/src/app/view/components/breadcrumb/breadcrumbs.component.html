<nav class="flex flex-wrap items-center gap-2" aria-label="Model levels">
  @for (record of storage.records(); track record.modelId) {
    <button
      suiButton
      [variant]="workspace.store.currentSlot() === record.slot ? 'outlined' : 'text'"
      size="sm"
      [attr.aria-current]="workspace.store.currentSlot() === record.slot ? 'page' : null"
      (click)="handleSelect(record.slot)"
    >
      {{ record.name }}
    </button>
  }
  @if (workspace.view.editable()) {
    @if (workspace.store.currentModelRecord(); as record) {
      <button suiButton variant="text" size="sm" (click)="handleEdit(record)">Edit level</button>
      <button suiButton variant="text" size="sm" severity="error" [disabled]="!canRemove(record)" (click)="handleRemove(record)">
        Remove level
      </button>
    }
    <button suiButton variant="outlined" size="sm" (click)="handleCreate()">+ Level</button>
  }
</nav>
