<main class="main-window mx-auto flex max-w-2xl flex-col justify-center gap-5 overflow-auto p-6">
  <h1 class="text-3xl">Create a Nori project</h1>
  <form class="flex flex-col gap-5" (ngSubmit)="handleCreateProject()">
    <label class="flex flex-col gap-2"
      >Project name
      <input suiInput name="name" maxlength="70" [(ngModel)]="manifest.name" required minlength="3" />
    </label>
    <label class="flex flex-col gap-2"
      >Description
      <textarea suiTextarea name="description" maxlength="140" [(ngModel)]="manifest.description"></textarea>
    </label>
    <p>Based on the RAMEN reference model.</p>
    <label><input suiCheckbox type="checkbox" name="example" [(ngModel)]="isCreatingExample" /> Start with a correspondence example</label>
    @if (storage.error(); as error) {
      <p suiMessage severity="error">{{ error }}</p>
    }
    <footer class="flex justify-between gap-3">
      <button suiButton variant="outlined" type="button" routerLink="/">Cancel</button>
      <button suiButton type="submit" [disabled]="!isFormValid() || pending">{{ pending ? 'Creating…' : 'Create project' }}</button>
    </footer>
  </form>
</main>
