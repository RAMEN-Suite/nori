<main *transloco="let t" class="workspace-shell">
  <section class="workspace-canvas" data-nori-motion [attr.aria-label]="t('editor.graph')">
    <app-visualizer
      #graph
      [canvasPadding]="graphPadding()"
      [inspectorOpen]="inspectorOpen()"
      (nodeSelected)="inspectorOpen.set(true)"
      class="block h-full"
    />
  </section>
  <app-tool-bar
    class="workspace-toolbar"
    [catalogueOpen]="catalogueOpen()"
    [levelsOpen]="levelsOpen()"
    (toggleCatalogue)="handleToggleCatalogue()"
    (toggleLevels)="handleToggleLevels()"
    (resetGraph)="graph.handleLayoutReset()"
    (fitGraph)="graph.handleFitView()"
    (configureColours)="graph.handleOpenColorsDialog()"
  />

  <div data-nori-motion class="workspace-left" [style.--nori-levels-height]="levelsHeight()" [class.levels-open]="levelsOpen()">
    <div class="panel-slot catalogue-slot" data-nori-motion>
      <app-editor-panel
        class="workspace-catalogue"
        [open]="catalogueOpen()"
        [title]="t(workspace.store.currentSlot() > 0 ? 'editor.refinements' : 'editor.nodes')"
        [closeLabel]="t('editor.closeNodes')"
        (closePanel)="catalogueOpen.set(false)"
      >
        <app-side-menu (nodeSelected)="inspectorOpen.set(true)" class="block h-full min-h-0" />
      </app-editor-panel>
    </div>
    <div class="panel-slot levels-slot" data-nori-motion>
      <app-editor-panel
        [open]="levelsOpen()"
        [title]="t('editor.levels')"
        [closeLabel]="t('editor.closeLevels')"
        (closePanel)="levelsOpen.set(false)"
      >
        <app-model-levels class="block h-full min-h-0" />
      </app-editor-panel>
    </div>
  </div>

  <div class="workspace-right">
    <app-editor-panel
      [open]="inspectorOpen()"
      side="right"
      heading="subtle"
      [title]="t('editor.inspector')"
      [closeLabel]="t('editor.closeInspector')"
      (closePanel)="inspectorOpen.set(false)"
    >
      <div class="editor-panel-scroll h-full min-h-0 overflow-auto"><router-outlet /></div>
    </app-editor-panel>
  </div>
</main>
