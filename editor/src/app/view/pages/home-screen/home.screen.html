<main class="home-screen relative isolate flex min-h-full flex-col overflow-y-auto">
  <header class="home-chrome flex justify-end px-5 py-5 sm:px-6" data-nori-motion>
    <button suiButton severity="neutral" variant="text" size="sm" shape="circle" aria-label="Settings" (click)="handleSettings()">
      <svg lucideSettings class="size-5" aria-hidden="true"></svg>
    </button>
  </header>

  <section
    class="home-intro mx-auto my-auto grid w-full grid-cols-1 items-center gap-8 px-5 py-10 md:grid-cols-2 md:gap-0 md:px-0"
    aria-labelledby="home-title"
  >
    <div class="home-brand flex flex-col items-center justify-center gap-5 text-center md:gap-3">
      <app-brand-illustration />
      <div class="home-heading" data-nori-motion>
        <h1 id="home-title" class="home-title">Nori</h1>
      </div>
    </div>

    <sui-card class="home-actions mx-auto block w-full max-w-md" data-nori-motion size="lg" variant="border">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-4">
          <h2 class="home-action-title">Modelling Data</h2>
          <p class="text-base-content/65 leading-relaxed">
            Turn people, places and sources into a connected model for your digital edition.
          </p>
        </div>
        <nav class="flex flex-wrap gap-2" aria-label="Explore RAMEN">
          @for (resource of resources; track resource.url) {
            <a suiButton severity="neutral" variant="soft" size="xs" [appExternalLink]="resource.url">
              {{ resource.label }}<svg lucideArrowUpRight class="size-3" aria-hidden="true"></svg>
            </a>
          }
        </nav>
        <nav class="flex flex-col gap-3" aria-label="Project actions">
          <button suiButton size="lg" severity="neutral" variant="outlined" routerLink="/open">
            <svg lucideFolderOpen class="size-4" aria-hidden="true"></svg>Open project
          </button>
          <button suiButton size="lg" routerLink="/start"><svg lucidePlus class="size-4" aria-hidden="true"></svg>Create project</button>
          <button suiButton severity="neutral" variant="link" [loading]="importing()" [disabled]="importing()" (click)="modelFile.click()">
            Import model
          </button>
          <input #modelFile type="file" accept=".json,application/json" hidden (change)="handleImport(modelFile)" />
        </nav>
        @if (importError()) {
          <p suiMessage severity="error">{{ importError() }}</p>
        }
      </div>
    </sui-card>
  </section>

  <footer data-nori-motion class="home-chrome text-base-content/50 flex justify-center py-4 text-xs tracking-wide">
    <span>Version {{ environment.appVersion }}</span>
  </footer>
</main>
