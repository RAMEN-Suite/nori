<main *transloco="let t" class="entry-screen relative isolate flex min-h-full flex-col overflow-y-auto">
  <app-entry-backdrop class="home-backdrop" />
  <header class="entry-chrome flex justify-end px-5 py-5 sm:px-6" data-nori-motion>
    <app-settings-button />
  </header>

  <section
    class="home-intro mx-auto my-auto grid w-full grid-cols-1 items-center gap-8 px-5 py-10 md:grid-cols-2 md:gap-0 md:px-0"
    aria-labelledby="home-title"
  >
    <div class="home-brand flex flex-col items-center justify-center gap-5 text-center md:gap-3">
      <app-brand-illustration />
      <h1 id="home-title" class="sr-only">Nori</h1>
    </div>

    <sui-card class="entry-card home-actions mx-auto block w-full max-w-md" data-nori-motion size="lg" variant="border">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-4">
          <h2 class="home-action-title">{{ t('home.title') }}</h2>
          <p class="text-base-content/65 leading-relaxed">
            {{ t('home.description') }}
          </p>
        </div>
        <nav class="flex flex-wrap gap-2" [attr.aria-label]="t('home.resources')">
          @for (resource of resources; track resource.url) {
            <a suiButton severity="neutral" variant="soft" size="xs" [appExternalLink]="resource.url">
              {{ resource.label }}<svg lucideArrowUpRight class="size-3" aria-hidden="true"></svg>
            </a>
          }
        </nav>
        <nav class="flex flex-col gap-3" [attr.aria-label]="t('home.actions')">
          <button suiButton size="lg" severity="neutral" variant="outlined" routerLink="/open" [disabled]="importing()">
            <svg lucideFolderOpen class="size-4" aria-hidden="true"></svg>{{ t('home.open') }}
          </button>
          <button suiButton size="lg" routerLink="/start" [disabled]="importing()">
            <svg lucidePlus class="size-4" aria-hidden="true"></svg>{{ t('home.create') }}
          </button>
          <button suiButton severity="neutral" variant="link" [loading]="importing()" [disabled]="importing()" (click)="modelFile.click()">
            {{ t('home.import') }}
          </button>
          <input #modelFile type="file" accept=".json,application/json" hidden (change)="handleImport(modelFile)" />
        </nav>
        @if (importError()) {
          <p suiMessage severity="error" role="alert">{{ importError() }}</p>
        }
      </div>
    </sui-card>
  </section>
</main>
