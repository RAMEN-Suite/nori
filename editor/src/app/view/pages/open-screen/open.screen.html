<main class="main-window mx-auto flex max-w-3xl flex-col justify-center gap-5 overflow-auto p-6">
  <h1 class="text-3xl">Open a Nori project</h1>
  <label class="flex flex-col gap-2"
    >Find a project
    <input suiInput type="search" name="search" [ngModel]="searchInput()" (ngModelChange)="searchInput.set($event)" />
  </label>
  <div class="flex flex-col gap-4 overflow-auto">
    @for (manifest of filteredManifests(); track manifest.projectId) {
      <article class="border-base-300 bg-base-100 flex flex-wrap items-center gap-3 rounded-lg border p-4">
        <button suiButton variant="text" (click)="handleOpenProject(manifest.projectId)">{{ manifest.name }}</button>
        <p class="grow">{{ manifest.description }}</p>
        <time class="text-sm" [attr.datetime]="manifest.updatedAt">{{ manifest.updatedAt | date }}</time>
        <button suiButton size="sm" variant="outlined" (click)="handleDuplicateProject(manifest)">Duplicate</button>
        <button suiButton size="sm" severity="error" variant="outlined" (click)="handleDeleteProject(manifest)">Remove</button>
      </article>
    } @empty {
      <p>No projects found.</p>
    }
  </div>
  <footer class="flex gap-3">
    <button suiButton variant="outlined" routerLink="/">Cancel</button>
    <button suiButton routerLink="/start">New project</button>
  </footer>
</main>
