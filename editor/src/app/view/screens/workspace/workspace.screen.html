<main *transloco="let t" class="workspace-shell" [class.editing-properties]="propertyEditing.isOpen()">
  <div
    class="workspace-model-view"
    [class.is-hidden]="propertyEditing.isOpen() && !propertyEditing.isClosing()"
    [inert]="propertyEditing.isOpen()"
    [attr.aria-hidden]="propertyEditing.isOpen()"
  >
    <section class="workspace-canvas" data-nori-motion [attr.aria-label]="t('editor.graph')">
      <nori-graph-view #graph [canvasPadding]="graphPadding()" (nodeSelected)="isInspectorOpen.set(true)" class="block h-full" />
    </section>
    <nori-tool-bar
      class="workspace-toolbar"
      [catalogueOpen]="isCatalogueOpen()"
      [levelsOpen]="isLevelsPanelOpen()"
      [inspectorOpen]="isInspectorOpen()"
      [baseNodesOpen]="isBaseNodesPanelOpen()"
      (toggleBaseNodes)="isBaseNodesPanelOpen.set(!isBaseNodesPanelOpen())"
      (toggleCatalogue)="handleToggleCatalogue()"
      (toggleLevels)="handleToggleLevels()"
      (toggleInspector)="isInspectorOpen.set(!isInspectorOpen())"
      (resetGraph)="graph.handleLayoutReset()"
      (exportImage)="graph.handleExportImage($event)"
      (fitGraph)="graph.handleFitView()"
      (configureColours)="graph.handleOpenColoursDialog()"
    />

    <div
      data-nori-motion
      class="workspace-column workspace-left"
      [class.both-open]="isCatalogueOpen() && isBaseNodesPanelOpen() && workspace.queries.isEditable()"
    >
      <div class="panel-slot top-slot" data-nori-motion>
        <nori-editor-panel
          class="workspace-catalogue"
          [open]="isCatalogueOpen()"
          [title]="t(workspace.store.currentLevelIndex() > 0 ? 'editor.refinements' : 'editor.baseNodes')"
          [closeLabel]="t('editor.closeNodes')"
          (closePanel)="isCatalogueOpen.set(false)"
        >
          <span panel-icon class="contents">
            @if (workspace.queries.isEditable()) {
              <svg lucideGitBranch class="size-4 shrink-0" aria-hidden="true"></svg>
            } @else {
              <svg lucideBoxes class="size-4 shrink-0" aria-hidden="true"></svg>
            }
          </span>
          <nori-refinements (nodeSelected)="isInspectorOpen.set(true)" class="block h-full min-h-0" />
        </nori-editor-panel>
      </div>
      <div class="panel-slot bottom-slot" data-nori-motion>
        <nori-editor-panel
          [open]="isBaseNodesPanelOpen() && workspace.queries.isEditable()"
          [title]="t('editor.baseNodes')"
          [closeLabel]="t('editor.closeBaseNodes')"
          (closePanel)="isBaseNodesPanelOpen.set(false)"
        >
          <svg panel-icon lucideBoxes class="size-4 shrink-0" aria-hidden="true"></svg>
          <nori-base-nodes (nodeSelected)="isInspectorOpen.set(true)" class="block h-full min-h-0" />
        </nori-editor-panel>
      </div>
    </div>

    <div
      class="workspace-column workspace-right"
      data-nori-motion
      [style.--nori-levels-height]="levelsHeight()"
      [class.levels-open]="isLevelsPanelOpen()"
    >
      <div class="panel-slot top-slot" data-nori-motion>
        <nori-editor-panel
          [open]="isInspectorOpen()"
          side="right"
          [title]="t('editor.inspector')"
          [closeLabel]="t('editor.closeInspector')"
          (closePanel)="isInspectorOpen.set(false)"
        >
          <svg panel-icon lucideScanEye class="size-4 shrink-0" aria-hidden="true"></svg>
          <div class="editor-panel-scroll absolute inset-0 overflow-auto">
            <router-outlet class="hidden" />
          </div>
        </nori-editor-panel>
      </div>
      <div class="panel-slot bottom-slot" data-nori-motion>
        <nori-editor-panel
          side="right"
          [open]="isLevelsPanelOpen()"
          [title]="t('editor.levels')"
          [closeLabel]="t('editor.closeLevels')"
          (closePanel)="isLevelsPanelOpen.set(false)"
        >
          <svg panel-icon lucideLayers class="size-4 shrink-0" aria-hidden="true"></svg>
          <nori-model-levels class="block h-full min-h-0" />
        </nori-editor-panel>
      </div>
    </div>
  </div>
  @if (propertyEditing.isOpen()) {
    <nori-property-editor
      class="workspace-property-screen"
      [class.is-leaving]="propertyEditing.isClosing()"
      [inert]="propertyEditing.isClosing()"
    />
  }
</main>
