@if (introVisible()) {
  <nori-logo-intro (revealing)="introPlaying.set(false)" (completed)="finishIntro()" />
}
<main
  *transloco="let t"
  class="entry-screen relative isolate flex min-h-full flex-col overflow-y-auto"
  [class.play-brand-intro]="playLogoIntro"
  [class.nori-intro-active]="introPlaying() && introVisible()"
  [inert]="introVisible()"
  [attr.aria-hidden]="introVisible() ? 'true' : null"
>
  <nori-entry-backdrop class="home-backdrop" data-nori-motion />
  <header class="entry-chrome flex items-center justify-between px-5 sm:px-6" data-nori-motion>
    <a routerLink="/" class="home-wordmark" data-nori-motion [attr.aria-label]="t('common.home')">
      <span class="home-logo" style="mask-image: url('images/nori-logo-clean.svg')" aria-hidden="true"></span>
      <span class="home-wordmark-name" aria-hidden="true">Nori</span>
    </a>
    <nori-settings-button />
  </header>

  <section
    class="home-intro mx-auto my-auto grid w-full grid-cols-1 items-center gap-8 px-5 py-10 md:grid-cols-2 md:gap-0 md:px-0"
    aria-labelledby="home-title"
  >
    <div class="home-brand flex flex-col items-center justify-center gap-5 text-center md:gap-3">
      <nori-brand-illustration />
      <h1 id="home-title" class="sr-only">Nori</h1>
    </div>

    <sui-card class="entry-card home-actions mx-auto block w-full max-w-[30rem]" data-nori-motion size="lg" variant="border">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-4">
          <h2 class="home-action-title">{{ t('home.title') }}</h2>
          <p class="text-base-content/65 leading-relaxed">
            {{ t('home.description') }}
          </p>
        </div>
        <nav class="flex flex-wrap gap-2" [attr.aria-label]="t('home.resources')">
          @for (resource of resources; track resource.url) {
            <a suiButton severity="neutral" variant="soft" size="xs" [noriExternalLink]="resource.url">
              @switch (resource.icon) {
                @case ('schema') {
                  <svg lucideFileBraces class="size-3 shrink-0" aria-hidden="true"></svg>
                }
                @case ('suite') {
                  <svg lucideBoxes class="size-3 shrink-0" aria-hidden="true"></svg>
                }
                @case ('core') {
                  <svg lucideCodeXml class="size-3 shrink-0" aria-hidden="true"></svg>
                }
              }
              {{ resource.label }}<svg lucideArrowUpRight class="size-3 shrink-0" aria-hidden="true"></svg>
            </a>
          }
        </nav>
        <nav class="flex flex-col gap-3" [attr.aria-label]="t('home.actions')">
          <button suiButton size="lg" severity="neutral" variant="outlined" routerLink="/open" [disabled]="importing()">
            <svg lucideFolderOpen class="size-4" aria-hidden="true"></svg>{{ t('home.open') }}
          </button>
          <button suiButton size="lg" routerLink="/start" [disabled]="importing()">
            <svg lucidePlus class="size-4" aria-hidden="true"></svg>{{ t('home.create') }}
          </button>
          <button suiButton severity="neutral" variant="link" [loading]="importing()" [disabled]="importing()" (click)="modelFile.click()">
            {{ t('home.import') }}
          </button>
          <input #modelFile type="file" accept=".json,application/json" hidden (change)="handleImport(modelFile)" />
        </nav>
        @if (importError()) {
          <p suiMessage severity="error" role="alert">{{ importError() }}</p>
        }
      </div>
    </sui-card>
  </section>
</main>
