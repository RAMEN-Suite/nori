@if (isElectronRuntime) {
  <app-title-bar />
}
<router-outlet />

<app-dialog-host />

@if (storage.error(); as error) {
  <div role="alert" class="bg-error text-error-content fixed bottom-4 left-4 z-50 max-w-lg rounded p-4">
    {{ error }} <button type="button" (click)="storage.error.set(null)">Dismiss</button>
  </div>
}
