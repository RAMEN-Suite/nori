@let isDark = editorState.state().theme === EDITOR_THEME.DARK;

<main class="main-window relative flex flex-col items-center justify-center gap-y-10 text-center" #main>
  <div class="flex flex-col gap-y-2" animate.enter="logo-entrance">
    <div class="flex flex-col">
      <svg height="126px" width="126px"><use href="images/ramen.svg#ramen-logo"></use></svg>
      <div class="text-5xl font-light font-stretch-semi-expanded select-none">NORI</div>
    </div>
    <div class="text-sm opacity-50">Version {{ environment.appVersion }}</div>
  </div>

  <div class="flex flex-col" animate.enter="menu-entrance">
    <p-button variant="text" size="large" icon="pi pi-folder-plus" label="create a new project" routerLink="start" />
    <p-button variant="text" size="large" icon="pi pi-folder" label="open an existing project" routerLink="open" />
  </div>

  <div class="mt-10 flex flex-col" animate.enter="sub-menu-entrance">
    <p-button
      variant="text"
      size="small"
      [icon]="isDark ? 'pi pi-moon' : 'pi pi-sun'"
      label="change theme"
      (click)="editorState.setTheme(isDark ? EDITOR_THEME.LIGHT : EDITOR_THEME.DARK)"
    />
    <p-button variant="text" size="small" icon="pi pi-github" label="RAMEN SUITE" (click)="handleOpenRepository()" />
  </div>

  <div class="background-circle h-170 w-170" animate.enter="logo-entrance"></div>
</main>
