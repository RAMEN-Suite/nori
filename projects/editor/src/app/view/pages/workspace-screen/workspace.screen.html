<app-tool-bar />

<main class="main-window flex h-full w-full overflow-hidden" style="--p-tool-bar-h: 50px">
  <aside class="w-65 shrink-0 border-r border-(--p-menubar-border-color) bg-(--p-menubar-background)/40" animate.enter="side-menu-entrance">
    <app-side-menu class="h-full w-full" />
  </aside>

  <section class="min-w-150 flex-1 shrink-0" animate.enter="node-view-entrance">
    <router-outlet />
  </section>

  <aside
    class="min-w-0 flex-1 border-l border-(--p-menubar-border-color) bg-(--p-menubar-background)/40"
    animate.enter="visualizer-entrance"
  >
    <app-visualizer class="h-full w-full" />
  </aside>
</main>
