<app-tool-bar />

<main class="main-window flex flex-row" style="--p-tool-bar-h: 50px">
  <div
    class="flex flex-2 border-r border-(--p-menubar-border-color) bg-(--p-menubar-background)/40"
    animate.enter="side-menu-entrance"
  >
    <app-side-menu class="basis-full" />
  </div>
  <div class="flex flex-5 items-center justify-center" animate.enter="content-entrance">
    <div class="text-center">sample text</div>
  </div>
  <div
    class="flex flex-5 border-l border-(--p-menubar-border-color) bg-(--p-menubar-background)/40"
    animate.enter="visualizer-entrance"
  >
    <app-visualizer class="basis-full" />
  </div>
</main>
