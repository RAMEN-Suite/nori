@let isDark = editorState.state().theme === EDITOR_THEME.DARK;

<header animate.enter="tool-bar-entrance">
  <p-menubar>
    <ng-template #start>
      <div class="flex cursor-pointer flex-row items-center select-none" routerLink="/">
        <svg height="24px" width="24px" class="mx-3">
          <use href="images/ramen.svg#ramen-logo"></use>
        </svg>
        <span class="font-bold uppercase">Nori</span>
      </div>
      <p-divider layout="vertical"></p-divider>
      <app-breadcrumbs />
    </ng-template>
    <ng-template #end>
      <div class="ml-2 flex items-center gap-2">
        <p-button
          pTooltip="Export JSON"
          tooltipPosition="bottom"
          positionTop="15"
          icon="pi pi-download"
          size="small"
          variant="text"
          fluid
        />
        <p-divider layout="vertical"></p-divider>
        <p-button
          [icon]="isDark ? 'pi pi-moon' : 'pi pi-sun'"
          pTooltip="Toggle Theme"
          tooltipPosition="bottom"
          positionTop="15"
          variant="text"
          size="small"
          fluid
          (click)="editorState.setTheme(isDark ? EDITOR_THEME.LIGHT : EDITOR_THEME.DARK)"
        />
        <p-button
          pTooltip="Hotkeys"
          tooltipPosition="bottom"
          positionTop="15"
          icon="pi pi-at"
          size="small"
          variant="text"
          fluid
        />
        <p-button
          icon="pi pi-cog"
          variant="text"
          fluid
          size="small"
          pTooltip="Settings"
          tooltipPosition="bottom"
          positionLeft="-10"
          positionTop="15"
        />
      </div>
    </ng-template>
  </p-menubar>
</header>
