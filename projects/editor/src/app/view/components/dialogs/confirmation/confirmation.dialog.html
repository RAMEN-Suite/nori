<div class="relative flex max-w-140 flex-col items-center rounded-(--p-dialog-border-radius) bg-(--p-menubar-background)/40 px-10 py-7">
  <div class="bg-primary text-primary-contrast absolute -left-7 -mt-13 inline-flex h-18 w-18 items-center justify-center rounded-full">
    <i class="pi text-3xl!" [class]="options()?.icon"></i>
  </div>
  <span class="mb-4 block text-2xl font-bold">{{ options()?.title }}</span>
  <p class="mb-0 text-center text-pretty" [innerHTML]="options()?.message"></p>
  <div class="mt-6 flex w-full flex-row items-center gap-2" [class]="options()?.justify">
    @for (group of options()?.buttons; track group) {
      <div class="flex flex-row gap-2">
        @for (button of group; track button.label) {
          <p-button
            [label]="button.label"
            [severity]="button.severity"
            [size]="button.size"
            [styleClass]="button.styleClass"
            [variant]="button.variant"
            (onClick)="button.click ? button.click() : null"
            styleClass="min-w-24"
          ></p-button>
        }
      </div>
    }
  </div>
</div>
