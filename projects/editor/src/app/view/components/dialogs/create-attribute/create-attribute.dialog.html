<div class="flex max-w-140 min-w-140 flex-col">
  <div class="flex flex-col gap-3">
    <p-fieldset legend="Basics">
      <div class="flex flex-col gap-2">
        <div class="flex flex-row gap-3">
          <p-ifta-label class="flex basis-full">
            <input [(ngModel)]="draftAttribute().name" pInputText id="attributeName" name="attributeName" fluid />
            <label for="attributeName">Attribute Name</label>
          </p-ifta-label>
          <p-ifta-label class="flex basis-full">
            <p-auto-complete
              [ngModel]="resolveTypeLabel(draftAttribute().typeId)"
              [suggestions]="filteredDataTypeOptions()"
              (completeMethod)="handleAutoComplete($event)"
              optionLabel="label"
              optionValue="value"
              dropdown
              fluid
            />
            <label for="attributeType">Attribute Type</label>
          </p-ifta-label>
        </div>
      </div>
    </p-fieldset>

    <p-fieldset legend="Advanced">
      <div class="flex flex-col gap-2">
        <div class="flex flex-row items-center gap-4">
          <i class="pi pi-exclamation-circle"></i>
          <div class="flex-6">Attribute is <span class="font-bold">required</span>?</div>
          <div class="flex-6 justify-center">
            <p-select-button
              [(ngModel)]="isRequired"
              [options]="selectOptions"
              optionLabel="label"
              optionValue="value"
              fluid
              size="small"
              styleClass="p-1!"
            />
          </div>
        </div>
        <div class="flex flex-col">
          <div class="flex flex-row items-center gap-4">
            <i class="pi pi-list"></i>
            <div class="flex-6">Attribute is a <span class="font-bold">list</span>?</div>
            <div class="flex-6 justify-center">
              <p-select-button
                [(ngModel)]="isList"
                [options]="selectOptions"
                optionLabel="label"
                optionValue="value"
                fluid
                size="small"
                styleClass="p-1!"
              />
            </div>
          </div>
        </div>
        <div class="flex flex-row items-center gap-4">
          <i class="pi pi-pen-to-square"></i>
          <div class="flex-6">Attribute is <span class="font-bold">read only</span>?</div>
          <div class="flex-6 justify-center">
            <p-select-button
              [(ngModel)]="isReadOnly"
              [options]="selectOptions"
              optionLabel="label"
              optionValue="value"
              fluid
              size="small"
              styleClass="p-1!"
            />
          </div>
        </div>
      </div>
    </p-fieldset>
  </div>

  <div class="mt-4 flex flex-row justify-between gap-2">
    <p-button label="Cancel" outlined />
    <p-button label="Add Attribute" outlined />
  </div>
</div>
