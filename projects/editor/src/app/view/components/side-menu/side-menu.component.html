<p-scroll-panel class="h-full min-h-0" style="--p-scrollpanel-bar-size: 4px">
  <div class="flex flex-col gap-5 px-4 py-4">
    <div class="flex flex-col">
      <p-ifta-label>
        <input pInputText id="filter" fluid [(ngModel)]="searchInput" />
        <label for="filter">Filter Nodes</label>
      </p-ifta-label>
    </div>
    <p-panel-menu [model]="filteredMenuItems()" multiple>
      <ng-template #item let-item>
        <div class="cursor-pointer">
          @if (item.isCategory) {
            <div
              pRipple
              class="mb-1.5 flex flex-row items-center justify-between border-b border-(--p-menubar-border-color) px-2 py-1.5"
            >
              <div class="flex font-bold font-stretch-semi-condensed">
                {{ item.label }}
              </div>
              <div class="flex">
                <p-button
                  [pTooltip]="item.button"
                  tooltipPosition="right"
                  icon="pi pi-plus"
                  size="small"
                  (click)="$event.stopPropagation()"
                  text
                />
              </div>
            </div>
          } @else {
            <div pRipple class="px-1 py-1.5" (contextmenu)="handleContextMenu($event, item)">
              @if (!item.hasErrors) {
                <span class="flex items-center gap-3">
                  <i class="pi pi-chevron-right" style="font-size: 8pt !important"></i>
                  {{ item.label }}
                </span>
              } @else {
                <span class="flex items-center gap-3 text-red-500">
                  <i class="pi pi-exclamation-triangle" style="font-size: 8pt !important"></i>
                  {{ item.label }}
                </span>
              }
            </div>
          }
        </div>
      </ng-template>
    </p-panel-menu>
  </div>
</p-scroll-panel>

<p-context-menu #contextMenuRef [model]="contextMenu()" appendTo="body">
  <ng-template #item let-item>
    <div
      pRipple
      class="flex cursor-pointer flex-row items-center justify-start gap-3 px-2 py-2"
      [class.text-(--p-red-500)]="item.severity === 'error'"
    >
      <div class="flex flex-2 items-center justify-center">
        <span [class]="item.icon"></span>
      </div>
      <div class="flex flex-10 items-center truncate">
        <span class="truncate text-sm">{{ item.label }}</span>
      </div>
    </div>
  </ng-template>
</p-context-menu>
