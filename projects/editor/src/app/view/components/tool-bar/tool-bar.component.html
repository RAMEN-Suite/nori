@let isDark = appState.state().theme === APP_THEME.DARK;

<header animate.enter="tool-bar-entrance">
  <p-menubar>
    <ng-template #start>
      <div class="flex cursor-pointer flex-row items-center select-none" routerLink="/" role="link" tabindex="0" aria-label="Go to home">
        <svg width="24" height="24" class="mx-3" role="img" aria-label="NORI logo">
          <use href="images/ramen.svg#ramen-logo"></use>
        </svg>
        <span class="font-bold uppercase">Nori</span>
      </div>
      <p-divider layout="vertical"></p-divider>
      <app-breadcrumbs />
    </ng-template>
    <ng-template #end>
      <div class="ml-2 flex items-center gap-2">
        <p-divider layout="vertical"></p-divider>
        <p-button
          [icon]="isDark ? 'pi pi-moon' : 'pi pi-sun'"
          aria-label="Toggle theme"
          pTooltip="Toggle Theme"
          tooltipPosition="bottom"
          positionTop="15"
          variant="text"
          size="small"
          fluid
          (click)="handleToggleTheme()"
        />
        <p-button
          icon="pi pi-cog"
          aria-label="Open settings"
          pTooltip="Settings"
          tooltipPosition="bottom"
          positionTop="15"
          positionLeft="-10"
          variant="text"
          size="small"
          fluid
        />
      </div>
    </ng-template>
  </p-menubar>
</header>
