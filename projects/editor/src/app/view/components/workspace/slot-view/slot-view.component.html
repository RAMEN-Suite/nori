<div class="grid h-full grid-rows-[1fr_auto]">
  @if (!workspace.store.currentModel()) {
    <div class="flex min-h-full flex-col justify-center select-none" animate.enter="slot-view-entrance">
      <div class="mb-20 flex flex-col items-center">
        <svg height="96px" width="96px"><use href="images/ramen.svg#ramen-logo"></use></svg>
        <h1 class="font-condens text-4xl font-light">Welcome to NORI</h1>
        <p class="my-3 text-center">Add your first Model to start modelling.</p>
        <div class="mt-10 flex flex-row gap-10">
          <div class="flex flex-col items-center gap-4">
            <p-button icon="pi pi-plus" size="large" (click)="handleOpenCreateModel()" />
            <span class="text-sm font-bold">Create Model</span>
          </div>
          <div class="flex flex-col items-center gap-4">
            <p-button icon="pi pi-download" size="large" [disabled]="true" />
            <span class="text-sm font-bold" [class.text-muted-color]="true">Import Model</span>
          </div>
        </div>
      </div>
    </div>
  }
</div>
