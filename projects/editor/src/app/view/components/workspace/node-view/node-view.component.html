<div class="grid h-full grid-rows-[1fr_auto] bg-(--p-menubar-background)/40">
  <p-scroll-panel class="min-h-full" animate.enter="node-editor-entrance">
    <ng-template #content>
      <div class="flex flex-col gap-5 px-5 py-3">
        <app-node-basics />

        <p-tabs [value]="activeTab()" class="border border-(--p-panel-border-color)">
          <p-tablist>
            <p-tab value="attributes" class="flex flex-6 justify-center" (click)="handleTab('attributes')">
              <div class="flex flex-row items-center gap-3">
                <i class="pi pi-sliders-h text-xs!"></i>
                <span class="font-light">Attributes</span>
              </div>
            </p-tab>
            <p-tab value="relations" class="flex flex-6 justify-center" (click)="handleTab('relations')">
              <div class="flex flex-row items-center gap-3">
                <i class="pi pi-share-alt text-xs!"></i>
                <span class="font-light">Relationships</span>
              </div>
            </p-tab>
          </p-tablist>
          <p-tabpanels>
            <p-tabpanel value="attributes">
              <app-node-attributes />
            </p-tabpanel>
            <p-tabpanel value="relations">
              <app-node-relations />
            </p-tabpanel>
          </p-tabpanels>
        </p-tabs>
      </div>
    </ng-template>
  </p-scroll-panel>

  <div
    class="flex min-h-15 w-full flex-row items-center justify-between gap-5 border-t border-(--p-menubar-border-color) bg-(--p-menubar-background) px-5"
    animate.enter="controls-entrance"
    animate.leave="controls-leave"
  >
    <div class="flex flex-row gap-5">
      <p-button label="Close View" size="small" variant="outlined" (click)="handleCloseView()"></p-button>
    </div>

    <div class="flex flex-row gap-5"></div>
  </div>
</div>
