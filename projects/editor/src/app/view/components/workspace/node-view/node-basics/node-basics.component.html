<div class="flex flex-row">
  <p-panel class="basis-full p-0!">
    <ng-template #header>
      <div class="flex basis-full flex-row items-center justify-between gap-3">
        <p-inplace class="basis-100" [active]="isNameActive()" (onActivate)="handleEditNodeName()">
          <ng-template #display>
            <span class="cursor-pointer text-4xl">{{ draftNode().name }}</span>
          </ng-template>
          <ng-template #content>
            <input
              [pAutoFocus]="isNameActive()"
              pInputText
              id="nodeName"
              name="nodeName"
              [(ngModel)]="draftNode().name"
              (keydown.enter)="handleEditNodeName()"
              fluid
            />
          </ng-template>
        </p-inplace>

        <div class="flex flex-row gap-2">
          <p-button
            [pTooltip]="!isNameActive() ? 'Edit Node Name' : 'Accept Node Name'"
            tooltipPosition="bottom"
            positionTop="10"
            showDelay="500"
            variant="outlined"
            [icon]="!isNameActive() ? 'pi pi-pencil' : 'pi pi-check'"
            (click)="handleEditNodeName()"
          />
          <p-button
            pTooltip="Duplicate {{ draftNode().name }}"
            tooltipPosition="bottom"
            positionTop="10"
            showDelay="500"
            variant="outlined"
            icon="pi pi-copy"
            (click)="handleDuplicateNode()"
          />
          <p-button
            pTooltip="Delete {{ draftNode().name }}"
            tooltipPosition="bottom"
            positionTop="10"
            showDelay="500"
            variant="outlined"
            icon="pi pi-trash"
            severity="danger"
            (click)="handleDeleteNode()"
          />
        </div>
      </div>
    </ng-template>
    <div class="flex flex-row items-center gap-2">
      <span class="text-md font-light select-none">Inherits from:</span>
      @for (baseNode of [workspace.view.selectedBaseNode()]; track baseNode?.id) {
        <p-chip class="cursor-pointer px-4! py-1! text-xs select-none" (click)="handleOpenColorsDialog()">
          <div class="flex flex-row items-center gap-2">
            @let nodeId = baseNode?.id ?? '';
            @let hexColor = this.workspace.store.selectedNodeColors()[nodeId];
            <i class="pi pi-circle-fill" style="font-size: 7pt" [ngStyle]="{ color: hexColor }"></i>
            {{ baseNode?.name }}
          </div>
        </p-chip>
      }
    </div>
  </p-panel>
</div>

<p-confirm-dialog key="node-basics" />
