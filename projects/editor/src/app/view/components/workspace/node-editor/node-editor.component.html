@let currentNode = workspace.view.selectedWorkNode;

<div class="grid h-full grid-rows-[1fr_auto] bg-(--p-menubar-background)/40">
  @if (currentNode()) {
    <p-scroll-panel class="min-h-full" animate.enter="node-editor-entrance">
      <ng-template #content>
        <div class="flex flex-col gap-5 px-5 py-3">
          <div class="flex flex-row">
            <p-panel class="basis-full p-0!">
              <ng-template #header>
                <div class="flex basis-full flex-row items-center justify-between gap-3">
                  <p-inplace
                    class="basis-100"
                    [active]="isNodeNameActive()"
                    (onActivate)="handleEditNodeName()"
                  >
                    <ng-template #display>
                      <span class="cursor-pointer text-4xl">{{ currentNode()?.name }}</span>
                    </ng-template>
                    <ng-template #content>
                      <input
                        pInputText
                        id="nodeName"
                        name="nodeName"
                        [ngModel]="currentNode()?.name"
                        fluid
                      />
                    </ng-template>
                  </p-inplace>

                  <div class="flex flex-row gap-2">
                    <p-button
                      [pTooltip]="!isNodeNameActive() ? 'Edit Node Name' : 'Accept Node Name'"
                      tooltipPosition="bottom"
                      positionTop="10"
                      showDelay="500"
                      variant="outlined"
                      [icon]="!isNodeNameActive() ? 'pi pi-pencil' : 'pi pi-check'"
                      (click)="handleEditNodeName()"
                    />
                    <p-button
                      pTooltip="Duplicate {{ currentNode()?.name }}"
                      tooltipPosition="bottom"
                      positionTop="10"
                      showDelay="500"
                      variant="outlined"
                      icon="pi pi-copy"
                    />
                    <p-button
                      pTooltip="Delete {{ currentNode()?.name }}"
                      tooltipPosition="bottom"
                      positionTop="10"
                      showDelay="500"
                      variant="outlined"
                      icon="pi pi-trash"
                      severity="danger"
                    />
                  </div>
                </div>
              </ng-template>
              <div class="flex flex-row items-center gap-2">
                <span class="text-md font-light">Inherits from:</span>
                <p-chip class="cursor-pointer px-4! py-1! text-xs select-none">
                  {{ workspace.view.selectedBaseNode()?.name }}
                </p-chip>
              </div>
            </p-panel>
          </div>

          <p-tabs value="0" class="border border-(--p-panel-border-color)">
            <p-tablist>
              <p-tab value="0" class="flex flex-6 justify-center">
                <div class="flex flex-row items-center gap-3">
                  <i class="pi pi-sliders-h text-xs!"></i>
                  <span class="font-light">Attributes</span>
                </div>
              </p-tab>
              <p-tab value="1" class="flex flex-6 justify-center">
                <div class="flex flex-row items-center gap-3">
                  <i class="pi pi-share-alt text-xs!"></i>
                  <span class="font-light">Relationships</span>
                </div>
              </p-tab>
            </p-tablist>
            <p-tabpanels>
              <p-tabpanel value="0"></p-tabpanel>
              <p-tabpanel value="1"></p-tabpanel>
            </p-tabpanels>
          </p-tabs>
        </div>
      </ng-template>
    </p-scroll-panel>

    <div
      class="flex min-h-15 w-full flex-row items-center justify-between gap-5 border-t border-(--p-menubar-border-color) bg-(--p-menubar-background) px-5"
      animate.enter="controls-entrance"
      animate.leave="controls-leave"
    >
      <div class="flex flex-row gap-5">
        <p-button
          label="Cancel"
          size="small"
          variant="outlined"
          (click)="handleCloseView()"
        ></p-button>
      </div>

      <div class="flex flex-row gap-5">
        <p-button label="Save & Validate" size="small" variant="outlined" />
        <p-button label="Reset" size="small" variant="outlined" />
      </div>
    </div>
  }
</div>
