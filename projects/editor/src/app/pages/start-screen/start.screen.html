<main class="min-h-window mx-auto flex max-w-2xl items-center">
  <section class="card flex w-full flex-col gap-5" animate.enter="card-entrance">
    <span class="block text-center text-3xl font-light">Creating a NORI Project</span>

    <p-fieldset legend="Basics">
      <div class="flex flex-col gap-3">
        <p-ifta-label>
          <input
            pInputText
            id="project_name"
            [(ngModel)]="manifest.name"
            maxlength="100"
            autocomplete="off"
            fluid
          />
          <label for="project_name">Project Name</label>
        </p-ifta-label>

        <p-ifta-label>
          <textarea
            pTextarea
            id="project_description"
            [(ngModel)]="manifest.description"
            maxlength="280"
            autocomplete="off"
            fluid
          ></textarea>
          <label for="project_description">Project Description</label>
        </p-ifta-label>
      </div>
    </p-fieldset>

    <p-fieldset legend="Modelling">
      <div class="flex flex-col gap-3">
        <p-ifta-label>
          <p-select
            id="metamodel"
            [(ngModel)]="manifest.metamodelId"
            [options]="metamodelService.metamodels()"
            optionValue="id"
            fluid
          >
            <ng-template let-model #selectedItem>
              {{ model.name }} <span class="text-xs">(v.{{ model.version }})</span>
            </ng-template>
            <ng-template let-model #item>
              {{ model.name }} <span class="text-xs">(v.{{ model.version }})</span>
            </ng-template>
          </p-select>
          <label for="metamodel">Metamodel</label>
        </p-ifta-label>

        <div class="flex items-center gap-3">
          <p-check-box id="metamodel_example" [(ngModel)]="isExampleNeeded" binary />
          <label
            for="metamodel_example"
            class="cursor-pointer text-sm"
            (click)="isExampleNeeded = !isExampleNeeded"
          >
            Create an example model based on the selected metamodel.
          </label>
        </div>
      </div>
    </p-fieldset>

    @if (isElectronRuntime) {
      <p-fieldset legend="Workspace">
        <div class="flex flex-col gap-3">
          <div class="flex flex-col gap-1">
            <p-input-group>
              <p-ifta-label>
                <input
                  [invalid]="!isLocationValid"
                  pInputText
                  id="project_location"
                  [(ngModel)]="manifest.location"
                  autocomplete="off"
                  fluid
                />
                <label for="project_location">Project Location</label>
              </p-ifta-label>
              <p-button
                icon="pi pi-folder-open"
                size="large"
                variant="outlined"
                (click)="handleProjectLocation()"
              />
            </p-input-group>
            <p-message severity="error" size="small" variant="simple">
              @if (!isLocationValid) {
                Cannot create a new project in selected folder location.
              }
            </p-message>
          </div>
        </div>
      </p-fieldset>
    }

    <div class="mt-4 flex flex-row items-center justify-center gap-5">
      <p-button label="Cancel" severity="danger" variant="outlined" routerLink="/" />
      <p-button
        label="Finish Setup"
        outlined="outlined"
        [disabled]="!isFormCompleted()"
        (click)="handleProjectCreation()"
      />
    </div>
  </section>
</main>
